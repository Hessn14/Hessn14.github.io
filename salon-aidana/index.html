<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e15">
<title>Aidana's living room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e15; --surface:#14151f; --surface2:#1a1b27; --border:#232536; --border2:#2f3247;
    --text:#ecebf3; --muted:#86849c; --faint:#55536a;
    --accent:#f2b8c8; --accent-d:#d98da3; --gold:#e9c77b;
    --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
    --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{background:var(--bg);color:var(--text)}
  body{
    font-family:var(--sans);font-size:15px;line-height:1.5;
    min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:36px 24px 56px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1;letter-spacing:-.01em}
  h1 em{color:var(--accent)}
  .ghost{background:none;border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s}
  .ghost:hover{border-color:var(--border2);color:var(--text)}

  .room{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#07080d}
  .screen-inner{position:relative;width:100%;aspect-ratio:256/160}
  #room{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
  .empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;
    font-family:var(--serif);font-style:italic;font-size:clamp(20px,3.4vw,32px);color:rgba(236,235,243,.85);padding:0 24px}
  .tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
  .tools .grp{display:flex;gap:8px;flex-wrap:wrap}
  .ghost.on{border-color:var(--accent);color:var(--accent)}
  .edit-hint{font-size:13px;color:var(--accent)}
  .room.editing{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,184,200,.12)}
  .room.editing #room{cursor:grab;touch-action:none}
  .room.editing.dragging #room{cursor:grabbing}
  .room.photo{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,199,123,.15)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.go{animation:flash .6s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .btn.small{display:inline-block;width:auto;padding:8px 18px;font-size:13px}
  a.btn{text-align:center;text-decoration:none;margin-bottom:10px}
  .photo-img{display:block;width:100%;border-radius:8px;margin-bottom:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  .wheel-wrap{position:relative;width:min(300px,74vw);aspect-ratio:1/1;margin:6px auto 22px}
  .wheel{display:block;width:100%;height:100%;border-radius:50%;box-shadow:0 12px 44px -14px rgba(242,184,200,.45)}
  .wheel-ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid var(--text);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .ghost.glow{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(233,199,123,.12)}
  .card.stored{opacity:.5}
  .card.stored .pv{filter:grayscale(.7)}
  .inv .card .tag{color:var(--muted)}
  .inv .card:not(.stored) .tag{color:var(--accent)}
  .badges{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;pointer-events:none}
  .cheat{display:flex;gap:8px;max-width:360px;margin:44px auto 0}
  .cheat input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;color:var(--text);
    font:inherit;font-size:14px;letter-spacing:.08em;text-transform:uppercase;outline:none;transition:border-color .2s}
  .cheat input::placeholder{text-transform:none;letter-spacing:0;color:var(--faint)}
  .cheat input:focus{border-color:var(--border2)}
  .cheat.shake{animation:shake .35s ease}
  .test-badge{font-size:11px;font-weight:500;background:rgba(91,42,138,.9);color:#fff;padding:4px 9px;border-radius:999px}
  .label{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
    font-size:12px;font-weight:500;background:rgba(13,14,21,.88);border:1px solid var(--border2);color:var(--text);
    padding:4px 10px;border-radius:999px;opacity:0;transition:opacity .25s}
  .label.show{opacity:1}
  .label b{color:var(--accent);font-weight:500}

  .meta{margin:18px 2px 0}
  .bar{height:3px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:3px;transition:width .6s ease}
  .meta-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
  .meta-row strong{color:var(--text);font-weight:500}
  #countdown{font-variant-numeric:tabular-nums}
  .hint{font-size:13px;color:var(--faint);margin-top:4px}

  h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:40px 2px 14px}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .tile{position:relative;aspect-ratio:1/1.12;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px 9px;transition:border-color .2s,transform .2s,background .2s}
  .tile .num{font-size:clamp(14px,2.2vw,20px);font-weight:600;line-height:1}
  .tile .mon{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .tile .ico{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 4px}
  .tile .ico svg{width:clamp(14px,2.4vw,20px);height:auto}
  .tile .ico canvas{max-width:86%;max-height:clamp(18px,4.2vw,40px);width:auto;height:auto;image-rendering:pixelated}
  .tile:not(.locked):hover{transform:translateY(-2px);border-color:var(--border2)}
  .tile.locked{cursor:not-allowed;color:var(--faint);background:transparent}
  .tile.locked .mon{color:var(--faint)}
  .tile.today{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,184,200,.12),0 8px 30px -10px rgba(242,184,200,.5);color:var(--accent)}
  .tile.today .num{color:var(--text)}
  .tile.late{border-color:rgba(233,199,123,.55);color:var(--gold)}
  .tile.done{background:var(--surface2)}
  .tile .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .tile.late .dot{background:var(--gold)}
  .tile.shake{animation:shake .35s ease}
  .tile:focus-visible,.btn:focus-visible,.card:focus-visible,.ghost:focus-visible,.x:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

  .final-banner{display:none;margin-top:36px;padding:28px 24px;border:1px solid rgba(242,184,200,.35);border-radius:16px;text-align:center;
    background:radial-gradient(ellipse at 50% 0%,rgba(242,184,200,.10),transparent 70%)}
  .final-banner.show{display:block;animation:rise .6s ease}
  .final-banner p{font-family:var(--serif);font-size:clamp(22px,3vw,30px);line-height:1.25}
  .final-banner em{color:var(--accent)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  footer{margin-top:20px;text-align:center;color:var(--faint);font-size:13px}

  .modal{position:fixed;inset:0;z-index:20;background:rgba(6,7,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .dialog{width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;animation:rise .3s ease}
  .dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  .dlg-head .t{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .x{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;flex:none}
  .x:hover{color:var(--text);border-color:var(--border2)}
  .note{font-family:var(--serif);font-size:24px;line-height:1.3;min-height:3.9em;padding-left:16px;border-left:2px solid var(--accent);margin-bottom:8px;cursor:pointer}
  .note .caret{display:inline-block;width:1px;height:.95em;background:var(--accent);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
  .sig{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:19px;text-align:right;margin:0 0 22px}
  @keyframes blink{50%{opacity:0}}
  .sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .bonus{display:flex;gap:10px;margin-bottom:22px}
  .bonus figure{flex:1;background:#0f1019;border:1px solid var(--border);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bonus .pv{height:56px;display:flex;align-items:flex-end;justify-content:center}
  .bonus canvas{image-rendering:pixelated;display:block}
  .bonus figcaption{font-size:12px;color:var(--muted)}
  .choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:20px}
  .choices.one{grid-template-columns:minmax(0,1fr)}
  .choices.many{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choices.many .card .pv{height:88px}
  .card{min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:10px 10px 14px;cursor:pointer;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,transform .2s,background .2s}
  .card .pv{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:#0f1019;border-radius:10px;overflow:hidden;margin-bottom:4px}
  .card .pv canvas{image-rendering:pixelated;display:block;max-width:100%;max-height:100%}
  .card .nm{font-size:14px;font-weight:600}
  .card .ds{font-size:13px;color:var(--muted);line-height:1.35}
  .card:hover:not([disabled]){transform:translateY(-2px);border-color:var(--border2)}
  .card.sel{border-color:var(--accent);background:#211d2b;box-shadow:0 0 0 3px rgba(242,184,200,.12)}
  .card[disabled]{cursor:default}
  .card.dim{opacity:.35}
  .card .tag{font-size:11px;font-weight:500;color:var(--accent);margin-top:2px}
  .mystery{height:120px;border-radius:14px;border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;margin-bottom:20px;
    font-family:var(--serif);font-size:56px;color:var(--accent);animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.45}}
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:14px 18px;font-size:15px;font-weight:600;cursor:pointer;background:var(--text);color:var(--bg);transition:transform .15s,opacity .2s,background .2s}
  .btn:hover:not([disabled]){transform:translateY(-1px)}
  .btn:active:not([disabled]){transform:translateY(1px)}
  .btn[disabled]{background:var(--surface2);color:var(--faint);cursor:not-allowed}
  .btn.accent{background:var(--accent);color:#2a1520}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);z-index:30;background:var(--surface2);border:1px solid var(--border2);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:600px){
    .wrap{padding:22px 14px 40px}
    header{margin-bottom:18px}
    .room{border-radius:12px;margin:0 -4px}
    .grid{gap:6px}
    .tile{border-radius:10px;padding:7px 2px 6px}
    .tile .mon{font-size:8px}
    .tile .dot{top:5px;right:5px;width:5px;height:5px}
    .dialog{padding:20px 16px;border-radius:18px}
    .note{font-size:21px}
    .card .pv{height:92px}
    .choices.many{grid-template-columns:repeat(2,minmax(0,1fr))}
    .bonus .pv{height:48px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">November 7 — 20</p>
      <h1><em>Aidana</em>'s living room</h1>
    </div>
    <button class="ghost" id="soundBtn" aria-pressed="true">Sound on</button>
  </header>

  <section class="room">
    <div class="screen-inner" id="screen">
      <canvas id="room" width="256" height="160" aria-label="The pixel art living room"></canvas>
      <div class="empty-hint" id="emptyHint">An empty living room… for now.</div>
      <div class="badges" id="badges"></div>
      <div class="flash" id="flash"></div>
    </div>
  </section>

  <div class="meta">
    <div class="bar"><i id="bar"></i></div>
    <div class="meta-row"><span id="statusTxt">…</span><span id="countdown"></span></div>
    <p class="hint" id="hint" hidden>Tap Cerise, Bushinka, Aidana or the toys in the room.</p>
    <div class="tools" id="tools" hidden>
      <span class="edit-hint" id="editHint" hidden>Drag objects to move them.</span>
      <div class="grp">
        <button class="ghost" id="wheelBtn" hidden>Wheel of fortune</button>
        <button class="ghost" id="invBtn" hidden>Inventory</button>
        <button class="ghost" id="storeBtn" hidden>Store in inventory</button>
        <button class="ghost" id="curtainBtn" hidden>Close the curtains</button>
        <button class="ghost" id="photoBtn" hidden>Photo mode</button>
        <button class="ghost" id="resetPosBtn" hidden>Reset positions</button>
        <button class="ghost" id="editBtn">Edit the decor</button>
        <button class="ghost" id="garageBtn">Garage</button>
        <button class="ghost" id="gLightBtn" hidden>Lights off</button>
        <button class="ghost" id="gDoorBtn" hidden>Open the door</button>
        <button class="ghost" id="exitPhotoBtn" hidden>Exit</button>
        <button class="btn accent small" id="shootBtn" hidden>Take the photo</button>
      </div>
    </div>
  </div>

  <h2>Calendar</h2>
  <div class="grid" id="grid"></div>

  <div class="final-banner" id="finalBanner"><p id="finalTxt"></p></div>

  <div class="cheat" id="cheatForm">
    <input id="cheatInput" type="text" maxlength="24" autocomplete="off" spellcheck="false" autocapitalize="characters" enterkeyhint="go" placeholder="Secret code" aria-label="Secret code">
    <button class="ghost" type="button" id="cheatBtn">Enter</button>
  </div>

  <footer id="foot"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <div class="t" id="dlgTitle">Day 1</div>
      <button class="x" id="dlgClose" aria-label="Close">✕</button>
    </div>
    <div class="note" id="dlgNote"><span id="dlgMsg"></span><span class="caret" id="caret"></span></div>
    <p class="sig" id="dlgSig"></p>
    <div id="dlgBody"></div>
    <button class="btn" id="dlgAction">Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';

/* =====================================================================
   CONFIGURATION — tout ce qui est personnalisable est ici
   ===================================================================== */
const CONFIG = {
  herName: 'Aidana',
  myName:  'Léo',
  catName: 'Cerise',
  dogName: 'Bushinka',
  start:   { y: 2026, m: 10, d: 7 },   // m = mois - 1 → 10 = novembre
  // Aidana en pixel art (tailleur tweed gris, cheveux longs bruns)
  her: {
    hair:'#2e1f1b', hairHi:'#5e3d2d', skin:'#f3d5c0', skinSh:'#e0b99f', eyes:'#1b1b22', blush:'#f0a9a9', lips:'#c86a76',
    top:'#18181d', tweed:'#807e85', tweedDk:'#5e5c63', tweedLt:'#a3a1a8', trim:'#121215', gold:'#e3c27c',
    tights:'#232129', shoes:'#0f0f12'
  },
  // Léo (jour 14) : cheveux bruns coiffés, moustache et bouc, chemise blanche, blazer marine
  me: {
    hair:'#4a2f1f', hairHi:'#70492f', skin:'#f0c9a8', skinSh:'#d9a98a', eyes:'#1b1b22', beard:'#5a3a26', mouth:'#c07a6a',
    blazer:'#1f2638', blazerSh:'#151a28', shirt:'#f3f1ec', shirtSh:'#d6d2ca', button:'#cfcac0',
    pants:'#2a2f3d', pantsSh:'#1e2230', shoes:'#5a3a26', shoesSh:'#7a5236'
  },
  // Cerise (chatte calico) et Bushinka (chiot caniche abricot)
  cat: { w:'#f4f1ec', W:'#d6d0c6', k:'#26232b', o:'#d98a3d', e:'#9cc46a', n:'#f2a0a8' },
  dog: { c:'#e6c597', C:'#c9a06e', l:'#f5e3c6', k:'#1b1b22' },
  // Le bouquet (mets les couleurs des vraies fleurs)
  flowers: { a:'#e8436b', aDark:'#b52a4e', b:'#ffc2d4', c:'#fff6ee', center:'#ffd36b',
             leaf:'#4f9a5a', leafDark:'#356e3f', paper:'#e8d9b8', paperSh:'#c9b58f', ribbon:'#c0504d' },
  finalMessage: "Living room complete. The flowers are real. Check your door / keep an eye out for the delivery."
};

/* Les 14 cases : petit mot + 2 objets au choix */
const DAYS = [
  { msg:"Welcome home. Well… home, pixel edition. Cerise and Bushinka have already made themselves comfortable. The living room, though, is still empty: let's start with the walls and the floor. One door a day until the 20th. No cheating.",
    picks:[
      { slot:'walls', title:'The walls', opts:[
        {id:'a',name:'Sage green',ds:'Soft, with fine stripes'},{id:'b',name:'Powder pink',ds:'Polka-dot wallpaper'},
        {id:'c',name:'Storm blue',ds:'Fine double stripes'},{id:'d',name:'Terracotta',ds:'Warm, limewash finish'},{id:'e',name:'Floral cream',ds:'Flowered wallpaper'}]},
      { slot:'floor', title:'The floor', opts:[
        {id:'a',name:'Honey oak',ds:'Wide, soft planks'},{id:'b',name:'Herringbone',ds:'The classic Parisian parquet'},
        {id:'c',name:'White marble',ds:'With grey veins'},{id:'d',name:'Black marble',ds:'With gold veins'},{id:'e',name:'Dark walnut',ds:'Deep and cosy'}]}
    ]},
  { msg:"Two things today. First, a big window: pick the city you'd like to see in the evening. Then a rug, and it's urgent: Bushinka needs somewhere soft to nap, and Cerise needs somewhere to sharpen her claws (that isn't the sofa). Choose wisely, peace in the house depends on it.",
    picks:[
      { slot:'window', title:'The view from the window', opts:[
        {id:'paris',name:'Paris view',ds:'The Eiffel Tower, sparkling'},
        {id:'almaty',name:'Almaty view',ds:'Snowy peaks and Kok-Tobe'},
        {id:'vancouver',name:'Vancouver view',ds:'The harbour, the mountains, the rain'},
        {id:'dubai',name:'Dubai view',ds:'Burj Khalifa at sunset'},
        {id:'abudhabi',name:'Abu Dhabi view',ds:'The Grand Mosque, all in white'},
        {id:'singapore',name:'Singapore view',ds:'Marina Bay Sands and the Supertrees'},
        {id:'shanghai',name:'Shanghai view',ds:'The Pearl Tower over the river'},
        {id:'miami',name:'Miami view',ds:'Palm trees and Art Deco'},
        {id:'london',name:'London view',ds:'Big Ben and the London Eye'}]},
      { slot:'rug', title:'The rug', opts:[
        {id:'a',name:'Beige rug',ds:'Oval and fluffy'},{id:'b',name:'Retro rug',ds:'70s orange and teal stripes'},
        {id:'c',name:'Berber rug',ds:'Cream with black diamonds'},{id:'d',name:'Round pink rug',ds:'Soft as a cloud'}]}
    ]},
  { slot:'curtains', msg:"A window this big deserves to be dressed. Curtains, for the mornings when you want to sleep in a little longer.",
    opts:[{id:'a',name:'Linen voiles',ds:'Light and airy'},{id:'b',name:'Burgundy velvet',ds:'Very cosy'},
          {id:'c',name:'Emerald velvet',ds:'Deep and chic'},{id:'d',name:'Mustard curtains',ds:'A ray of sunshine'}]},

    if (fr < .1) return seam;

  x = Math.round(x); y = Math.round(y);
  switch (kind){
    case 'yarnP': case 'yarnB': { const c = kind==='yarnP' ? '#f28aa8' : '#7fb3e0', d = shade(c,.72);
      spr(BALL,{x:c},x-2,y-4); p(x-1,y-3,d); p(x,y-2,d); p(x+1,y-3,d); p(x-1,y-1,d);
      p(x+2,y-1,c); p(x+3,y,c); p(x+4,y,c); p(x+5,y-1,c); break; }
    case 'tennis': spr(BALL,{x:'#cfe24a'},x-2,y-4); p(x-1,y-3,'#f6fbe0'); p(x,y-2,'#f6fbe0'); p(x+1,y-1,'#f6fbe0'); break;
    case 'redball': spr(BALL,{x:'#e0504d'},x-2,y-4); p(x-1,y-3,'#ffb0aa'); break;
    case 'mouse': spr(['.p...','gggg.','ggggt','....t'],{p:'#f2a0a8',g:'#9a98a0',t:'#c9a0a8'},x-2,y-4,flip); break;
    case 'feather': spr(['.....ff','....ff.','...b...','..b....','.b.....','b......'],{f:'#5bc0c8',b:'#c9a45c'},x-3,y-6,flip); break;
    case 'rope': spr(['k.....k','rwrwrwr','k.....k'],{k:'#e8e2d6',r:'#c0504d',w:'#e8e2d6'},x-3,y-3); break;
    case 'plush': spr(['b...b','bbbbb','b...b'],{b:'#f2d0a0'},x-2,y-3); p(x,y-2,'#d9b080'); break;
  }
}
function drawToysItem(opt){ const k = TOY_KITS[opt] || TOY_KITS.a; drawToy(k[0],123,151); drawToy(k[1],134,151); }
let TOYS = [], toysKey = null;
function syncToys(){
  const k = chosenFor('toys'); if (k === toysKey) return; toysKey = k;
  TOYS = k ? TOY_KITS[k].map((kind,i)=>({ kind, x: i ? 178 : 84, y: i ? 154 : 150, vx:0, vy:0, carrier:null, flip:false })) : [];
}
function updateToys(){
  TOYS.forEach(o=>{
    if (o.carrier){ o.x = o.carrier.x + o.carrier.dir*7; o.y = o.carrier.y; o.flip = o.carrier.dir < 0; return; }
    if (Math.abs(o.vx) + Math.abs(o.vy) < .02){ o.vx = o.vy = 0; return; }
    o.x += o.vx; o.y += o.vy; o.vx *= .93; o.vy *= .93;
    if (o.y < 124){ o.y = 124; o.vy = Math.abs(o.vy)*.6; } if (o.y > 157){ o.y = 157; o.vy = -Math.abs(o.vy)*.6; }
    const l = lw(o.y) + 8; if (o.x < l){ o.x = l; o.vx = Math.abs(o.vx)*.6; } if (o.x > W-l){ o.x = W-l; o.vx = -Math.abs(o.vx)*.6; }
    if (Math.abs(o.vx) > .05) o.flip = o.vx < 0;
  });
}

      const side = h.x < pt.x ? -1 : 1; h.tx = clampX(pt.x + side*11, pt.y); h.ty = pt.y + .5;

// ordre de dessin, de l'arrière vers l'avant
function drawOrder(){
  const out = [...BACK, ...BACK_SPECIALS].filter(s=>chosenFor(s) && !isFront(s));
  if (chosenFor('petcorner') && !isFront('petcorner')) out.push('petcorner');
  if (chosenFor('rug')) out.push('rug');
  floorEnts().forEach(e=>{ if (e.slot) out.push(e.slot); });
  return out;
}
function drawAlone(ctx, s){
  const prev = X; X = ctx; ctx.clearRect(0,0,W,H); drawSlot(s, chosenFor(s), T, {hit:true}); if (ITEMS[s].glow && s!=='window') glowSlot(s, chosenFor(s), T, {hit:true}); X = prev;
}
function tightBox(s){
  const o = chosenFor(s), key = s+o;
  if (!tightCache[key]){
    const save0 = state.pos[s]; delete state.pos[s];
    drawAlone(hitCtx, s);
    if (save0) state.pos[s] = save0;
    const d = hitCtx.getImageData(0,0,W,H).data; let x0=W,y0=H,x1=-1,y1=-1;
    for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (d[(y*W+x)*4+3] > 20){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    tightCache[key] = x1<0 ? {x:0,y:0,w:1,h:1} : {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
  }
  const b = tightCache[key], [dx,dy] = userOff(s);
  return { x:b.x+dx, y:b.y+dy, w:b.w, h:b.h };
}
function hitSlot(x,y){
  const order = drawOrder().reverse();
  for (const s of order){
    const b = tightBox(s);
    if (x < b.x-2 || x > b.x+b.w+2 || y < b.y-2 || y > b.y+b.h+2) continue;

function drawWheel(cv, rot){

    } else {

  c.beginPath(); c.arc(cx,cy,34,0,Math.PI*2); c.fillStyle = '#14151f'; c.fill();

function spinWheel(cv){
  if (spinning || !wheelAvailable()) return;
  const n = SPECIALS.length, seg = Math.PI*2/n, TAU = Math.PI*2;
  const pool = SPECIALS.map((_,i)=>i).filter(i=>!pickOf(SPECIALS[i].slot));
  if (!pool.length) return;

  const target = -(k+.5)*seg + (Math.random()-.5)*seg*.6, start = wheelRot;
  const end = target + TAU*Math.ceil((start + TAU*5 - target)/TAU);

    if (q < 1) requestAnimationFrame(step); else wheelDone(k);

function pad(n){ return String(n).padStart(2,'0'); }
function countdownText(next){
  let ms = Math.max(0, next - now());
  const h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);
  return `Next door in ${h>=24?Math.floor(h/24)+'d ':''}${pad(h%24)}:${pad(m)}:${pad(s)}`;
}
function garageStatus(){
  const dn = dayNumber(), txt = $('statusTxt'), cd = $('countdown');
  const pending = GDAYS.map((_,i)=>i+1).filter(i=>isUnlocked(i) && !gDone(i));
  let next = null;
  if (dn < 1){ txt.innerHTML = 'The garage opens on <strong>November 7</strong>.'; next = dateOfDay(1); }
  else if (gCount() >= 14) txt.innerHTML = '<strong>Garage complete</strong> · 14/14';
  else if (pending.includes(dn)) txt.innerHTML = '<strong>Today\'s garage door is waiting</strong>' + (pending.length>1 ? ` · ${pending.length-1} to catch up on` : '');
  else if (pending.length) txt.innerHTML = `<strong>${pending.length} garage door${pending.length>1?'s':''} to catch up on</strong>`;
  else txt.innerHTML = `Today's garage door is open · <strong>${gCount()}/14</strong>`;
  if (!next && gCount() < 14 && !DEV && dn>=1 && dn<14 && !pending.includes(dn)) next = dateOfDay(dn+1);
  cd.textContent = next ? countdownText(next) : '';
}
function updateStatus(){
  if (scene==='garage') return garageStatus();
  const dn = dayNumber(), txt = $('statusTxt'), cd = $('countdown');
  const pending = DAYS.map((_,i)=>i+1).filter(i=>isUnlocked(i) && !dayDone(i));
  let next = null;
  if (dn < 1){ txt.innerHTML = 'The first door opens on <strong>November 7</strong>.'; next = dateOfDay(1); }
  else if (isFinal()){ txt.innerHTML = `<strong>Living room complete</strong> · ${countChosen()}/14`; }
  else if (pending.includes(dn)){ txt.innerHTML = '<strong>Today\'s door is waiting</strong>' + (pending.length>1?` · ${pending.length-1} to catch up on`:''); }
  else if (pending.length){ txt.innerHTML = `<strong>${pending.length} door${pending.length>1?'s':''} to catch up on</strong>`; }
  else if (dn < 14){ txt.innerHTML = `Today\'s door is open · <strong>${countChosen()}/14</strong>`; }
  else { txt.innerHTML = 'The last door is waiting…'; }
  if (!next && !isFinal() && !DEV && dn>=1 && dn<14 && !pending.includes(dn)) next = dateOfDay(dn+1);
  if (next){
    let ms = Math.max(0, next - now());
    const h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4), s = Math.floor(ms%6e4/1e3);

room.addEventListener('pointerdown', e=>{
  if (scene==='garage'){ const [gx,gy] = roomXY(e); garageTap(gx,gy); return; }
  if (editing || photoMode || !residents()) return;
  const [x,y] = roomXY(e);
  const hits = [];
  PETS.forEach(pt=>{ if (pt.room!=='room') return; const g = petGeom(pt); if (x>=g.sx-3 && x<=g.sx+g.w+3 && y>=g.sy-3 && y<=g.sy+g.h+2) hits.push({z:inBack(pt)?0:(onLap(pt)?.6:g.fy), pt, g}); });
  humans().forEach(h=>{ if (h.room!=='room') return; const g = humanGeom(h); if (x>=g.x0-1 && x<=g.x0+17 && y>=g.y0-1 && y<=g.y0+g.h+1) hits.push({ z: g.seated ? .5 : h.y, h, g }); });
  TOYS.forEach(o=>{ if (!o.carrier && Math.abs(x-o.x) < 6 && y > o.y-8 && y < o.y+3) hits.push({ z:o.y+.2, toy:o }); });
  if (!hits.length){
    const s = hitSlot(x,y);

      state.off = state.off || {}; state.off[s] = isOn(s); save();

    if (h.state==='idle') h.timer = Math.max(h.timer, 40);
    label(h.id, `${h===HER ? CONFIG.herName : CONFIG.myName} <b>♥</b>`, g.x0+8, g.y0-3); SFX.select();
  } else if (hit.toy){
    const o = hit.toy, a = Math.random()*Math.PI*2; o.vx = Math.cos(a)*2.4; o.vy = Math.sin(a)*1.2; SFX.tick();
  }
});

  SINGAPORE(){ return viewCheat('singapore','Singapore'); },
  SHANGHAI(){ return viewCheat('shanghai','Shanghai'); },
  MIAMI(){ return viewCheat('miami','Miami'); },
  LONDON(){ return viewCheat('london','London'); },
  TOYS(){ if (race) return 'Busy driving'; if (scene==='garage') return 'The toys are in the living room'; if (!TOYS.length) return 'No toys yet (day 10)'; PETS.forEach((pt,i)=>{ releasePet(pt); const o = TOYS[i % TOYS.length]; pt.toy = o; pt.plays = 5; goTo(pt,o.x,o.y,'toToy'); }); return 'Playtime!'; },
  CYCLE(){ if (!chosenFor('window')) return 'You need the window first (day 2)'; lightMode = null; cycleBase = VH; cycleF = 480; return 'A whole day in 24 seconds'; },
  CURTAINS(){ if (!chosenFor('curtains')) return 'You need curtains first (day 3)'; toggleCurtains(); return state.curtainsClosed ? 'Curtains closed' : 'Curtains open'; },
  PHOTO(){ if (!isFinal()) return 'Photo mode arrives on November 20'; if (photoMode){ exitPhoto(); return 'Photo mode closed'; } enterPhoto(); return 'Photo mode'; },
  WHEEL(){ openWheel(); return wheelAvailable() ? 'The wheel is waiting' : 'Already spun today'; },
  LIGHTS(){ const ls = ALL_SLOTS.filter(s=>s!=='window' && lightOf(s)); if (!ls.length) return 'No lights yet'; const allOff = ls.every(s=>!isOn(s)); state.off = state.off || {}; ls.forEach(s=>{ state.off[s] = !allOff; }); save(); return allOff ? 'Everything is on' : 'Everything is off'; },
  INVENTORY(){ if (scene==='garage') return 'The inventory is in the living room'; openInventory(); return 'Inventory'; },
  DOOR(){ if (!gPick('gdoor')) return 'The garage door arrives on day 5'; if (scene!=='garage') setScene('garage'); toggleGDoor(); return G().doorOpen ? 'Garage door open' : 'Garage door closed'; },
  GARAGE(){ setScene(scene==='garage' ? 'room' : 'garage'); return scene==='garage' ? 'Welcome to the garage' : 'Back to the living room'; },
  FLOOR(){ return cyclePick('floor', 'Floor'); },
  WALLS(){ return cyclePick('walls', 'Walls'); },
  RACE(){
    if (scene==='garage') return 'The race happens in the living room';
    if (!residents()) return nobody();
    if (!pickOf('sp_bmw')) return 'Win the BMW on the wheel of fortune first';
    if (!chosenFor('sp_bmw')) return 'The BMW is in the inventory';
    if (race) return 'Already racing';
    if (editing) setEditing(false); if (photoMode) exitPhoto();
    startRace(); document.querySelector('.room').scrollIntoView({behavior:'smooth', block:'center'});
    return `${CONFIG.catName} and ${CONFIG.dogName} hit the road`;
  },
  HINT(){ const list = FUN_CODES.filter(c=>c!=='HINT'); return 'Try: ' + list[Math.floor(Math.random()*list.length)]; }
};
// les anciens codes en français marchent toujours
Object.assign(CHEATS, { NEIGE:CHEATS.SNOW, BISOU:CHEATS.KISS, MIAOU:CHEATS.MEOW, OUAF:CHEATS.WOOF, CALIN:CHEATS.CUDDLE, CANAPE:CHEATS.SOFA,
  DANSE:CHEATS.DANCE, NUIT:CHEATS.NIGHT, JOUR:CHEATS.DAY, PETALES:CHEATS.PETALS, ETOILES:CHEATS.STARS, JOUETS:CHEATS.TOYS,
  RIDEAUX:CHEATS.CURTAINS, ROUE:CHEATS.WHEEL, LUMIERES:CHEATS.LIGHTS, INVENTAIRE:CHEATS.INVENTORY, PORTE:CHEATS.DOOR, SOL:CHEATS.FLOOR, MUR:CHEATS.WALLS, MURS:CHEATS.WALLS, WALL:CHEATS.WALLS, LONDRES:CHEATS.LONDON, SINGAPOUR:CHEATS.SINGAPORE, CALINS:CHEATS.HUG, COURSE:CHEATS.RACE, INDICE:CHEATS.HINT });
const FUN_CODES = ['GARAGE','FLOOR','WALLS','HUG','KISS','BACKFLIP','HEARTS','LONDON','MIAMI','SINGAPORE','SHANGHAI','ABUDHABI','RACE','WHEEL','LIGHTS','CYCLE','CURTAINS','SNOW','KISS','ZOOMIES','CERISE','BUSHINKA','CUDDLE','SOFA','DANCE','DISCO','NIGHT','DAY','PETALS','STARS','PARIS','ALMATY','VANCOUVER','DUBAI','TOYS','INVENTORY','HINT'];
function nobody(){ return 'Nobody is in the living room yet'; }
function petCheat(pt){
  if (!residents()) return nobody();
  if (race) return 'Busy driving';
  summon(pt);
  releasePet(pt); pt.hop = 8; setTimeout(()=>{ pt.hop = 8; SFX.pet(pt.kind); }, 450);
  const g = petGeom(pt); burst(g.sx+g.w/2, g.sy, 10, ['#f2b8c8','#ff7aa8','#ffd1dc'], true);
  label(pt.id, `${petName(pt)} <b>♥</b>`, g.sx+g.w/2, g.sy-2); SFX.pet(pt.kind);
  return pt.kind==='cat' ? 'Meow ♥' : 'Woof woof ♥';
}
function cyclePick(slot, label){
  if (!dayDone(1)) return 'Open the first door first';
  const pk = DAYS[0].picks.find(q=>q.slot===slot), ids = pk.opts.map(o=>o.id);
  const cur = ids.indexOf(pickOf(slot)), next = pk.opts[(cur + 1) % ids.length];
  state.picks[slot] = next.id; save(); buildGrid(); blip(800,.05,0,'sine',.05);
  return `${label}: ${next.name}`;
}
function viewCheat(id, name){ if (!chosenFor('window')) return 'You need the window first (day 2)'; state.picks.window = id; save(); buildGrid(); return 'View of ' + name; }
function runCheat(){
  const inp = $('cheatInput'), code = inp.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toUpperCase();
  inp.value = '';
  if (!code) return;
  const fn = CHEATS[code];
  if (fn){ SFX.place(); toast(fn()); inp.blur(); }
  else { SFX.nope(); const f = $('cheatForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); toast('Unknown code'); }
}
$('cheatBtn').addEventListener('click', runCheat);
$('cheatInput').addEventListener('keydown', e=>{ if ((e.key === 'Enter' || e.keyCode === 13) && !e.isComposing){ e.preventDefault(); runCheat(); } });


$('editBtn').addEventListener('click', ()=>{ SFX.select(); setEditing(!editing); });
$('curtainBtn').addEventListener('click', toggleCurtains);
$('wheelBtn').addEventListener('click', openWheel);
$('garageBtn').addEventListener('click', ()=>setScene(scene==='garage' ? 'room' : 'garage'));
$('gLightBtn').addEventListener('click', toggleGLights);
$('gDoorBtn').addEventListener('click', toggleGDoor);
$('invBtn').addEventListener('click', openInventory);
$('storeBtn').addEventListener('click', ()=>{ if (!selSlot) return; const n = itemName(selSlot); setStored(selSlot, true); selSlot = null; paintTools(); blip(500,.06,0,'sine',.06); toast(`${n} stored in the inventory`); });
$('photoBtn').addEventListener('click', enterPhoto);
$('exitPhotoBtn').addEventListener('click', exitPhoto);
$('shootBtn').addEventListener('click', shoot);
curtainP = state.curtainsClosed ? 1 : 0;
doorP = (state.garage && state.garage.doorOpen) ? 1 : 0;
if (state.scene==='garage'){ scene = 'garage'; document.querySelector('h2').textContent = 'Garage calendar'; $('emptyHint').textContent = 'An empty garage… for now.'; }
$('resetPosBtn').addEventListener('click', ()=>{ if (scene==='garage'){ G().pos = {}; G().front = []; save(); SFX.place(); toast('Objects back in place'); return; } state.pos = {}; state.front = []; save(); SFX.place(); toast('Objects back in place'); });

refresh();
requestAnimationFrame(loop);
})();
</script>
