<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Let’s date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f3c46b; --gold2:#c8963a; --rose:#ff6f9c; --rose2:#ff9a6b; --plum:#2a1430;
  --cream:#fff7ec; --ink:#3b2430;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1020;color:#fff;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
#app{position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden;overflow:clip;background:#1b1020}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fallbackBg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;touch-action:none}
#fallbackBg .art{font-size:min(30vw,170px);line-height:1.1;filter:drop-shadow(0 12px 30px rgba(0,0,0,.25));animation:floaty 4s ease-in-out infinite}
#fallbackBg .cap{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;opacity:.85}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(25,8,25,.42) 100%)}

/* HUD */
#hud{position:absolute;top:calc(var(--st) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;
  align-items:center;z-index:45;pointer-events:none;opacity:0;transition:opacity .6s}
#hud.show{opacity:1}
#progressWrap{display:flex;flex-direction:column;gap:4px}
#progress{display:flex;gap:5px;padding:7px 12px;border-radius:999px;background:rgba(35,14,35,.38);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14)}
#progress span{font-size:14px;line-height:1;color:rgba(255,255,255,.28);transition:color .5s,transform .5s}
#progress span.done{color:#ff8fb2}
#progress span.now{color:#fff;transform:scale(1.3);text-shadow:0 0 10px #ff6f9c}
#chapterTag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding-left:6px;
  color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.iconbtn{pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);
  background:rgba(35,14,35,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:19px;
  display:flex;align-items:center;justify-content:center;padding:0}

/* Banner */
#banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;
  pointer-events:none;opacity:0;transition:opacity .9s;text-align:center;padding:0 18px}
#banner.show{opacity:1}
#banner .num{letter-spacing:.42em;text-transform:uppercase;font-size:12px;font-weight:900;color:var(--gold);
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
#banner .title{font-family:'Great Vibes',cursive;font-size:clamp(46px,14vw,92px);line-height:1.05;margin:6px 0 4px;
  text-shadow:0 4px 30px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.3)}
#banner .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#banner .line{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto}
#banner.show .title{animation:rise 1.1s cubic-bezier(.2,.8,.2,1)}

/* Caption (top) */
#caption{position:absolute;top:calc(var(--st) + 84px);left:50%;transform:translateX(-50%);z-index:31;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;padding:6px 16px;border-radius:999px;
  background:rgba(35,14,35,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .6s;
  white-space:nowrap;pointer-events:none}
#caption.show{opacity:1}

/* Dialogue */
#dialogue{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 14px);z-index:36;display:flex;gap:12px;
  align-items:flex-start;padding:14px 16px 22px;border-radius:24px;max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(255,251,246,.97),rgba(255,239,232,.95));color:var(--ink);
  box-shadow:0 18px 50px rgba(30,5,25,.45),inset 0 0 0 1px rgba(255,255,255,.7);
  transform:translateY(140%);transition:transform .45s cubic-bezier(.2,.9,.3,1.15);pointer-events:none}
#dialogue.show{transform:none}
#dialogue .avatar{flex:0 0 56px;height:56px;border-radius:50%;background:#f4d6c8 center/cover no-repeat;
  border:3px solid #fff;box-shadow:0 0 0 2px var(--rose),0 6px 14px rgba(0,0,0,.18);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#d9748f,#b0305a)}
#dialogue .avatar.leo{background:linear-gradient(135deg,#3c4a6e,#1d2741)}
#dialogue .avatar.emoji{background:#fbe9e2;font-style:normal}
#dialogue .avatar.none{display:none}
#dialogue .body{flex:1;min-width:0}
#dialogue .name{font-weight:900;font-size:13px;color:#c2416f;letter-spacing:.08em;text-transform:uppercase;margin:2px 0 3px}
#dialogue .text{font-size:17px;line-height:1.42;font-weight:700;min-height:2.84em}
#dialogue.narr .text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;font-weight:600}
#dialogue .next{position:absolute;right:18px;bottom:7px;font-size:11px;font-weight:800;letter-spacing:.1em;color:#c2416f;
  opacity:0;text-transform:uppercase}
#dialogue.ready .next{opacity:.75;animation:bob 1s ease-in-out infinite}
#tapLayer{position:absolute;inset:0;z-index:35;display:none}

/* Prompt pill */
#prompt{position:absolute;left:50%;bottom:calc(var(--sb) + 30px);transform:translate(-50%,24px);z-index:33;
  padding:15px 24px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--rose),var(--rose2));
  color:#fff;font-weight:900;font-size:17px;box-shadow:0 12px 34px rgba(255,90,140,.5);opacity:0;pointer-events:none;
  transition:opacity .4s,transform .4s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#prompt.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;animation:pulse 1.7s ease-in-out infinite}

/* Fade */
#fade{position:absolute;inset:0;z-index:80;background:#fff3e8;opacity:0;pointer-events:none;transition:opacity .9s ease}
#fade.on{pointer-events:auto}

/* Generic overlays */
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--st) + 16px) 14px calc(var(--sb) + 16px);background:rgba(28,10,28,.42);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .45s;touch-action:none}
.overlay.show{opacity:1}
.btn{min-height:54px;min-width:120px;padding:0 26px;border-radius:999px;border:0;font-weight:900;font-size:19px;
  letter-spacing:.02em;transition:transform .25s,background .3s,opacity .3s;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn.yes{background:linear-gradient(135deg,#ff5c8d,#ff9a6b);color:#fff;box-shadow:0 10px 26px rgba(255,80,130,.45)}
.btn.no{background:#fff;color:#7a5868;border:2px solid #ecd2dc;box-shadow:0 6px 16px rgba(80,20,50,.12)}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(135deg,#f7d58b,#d6a24a);color:#4a2c10;box-shadow:0 10px 26px rgba(214,162,74,.45)}
.btn[disabled]{opacity:.45;filter:grayscale(.4)}
.btn.dodger{position:absolute;z-index:5;transition:left .28s cubic-bezier(.3,1.4,.5,1),top .28s cubic-bezier(.3,1.4,.5,1),transform .3s,opacity .3s}

/* Start screen */
#start{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--st) + 24px) 28px calc(var(--sb) + 24px);color:#f4ece4;
  background:radial-gradient(120% 70% at 50% 40%,#2c1c28 0%,#1a1118 60%,#120c11 100%);transition:opacity 1s}
#start .route{font-size:11px;font-weight:700;letter-spacing:.45em;text-transform:uppercase;color:#c9a66b;margin-left:.45em}
#start .rule{width:46px;height:1px;background:#c9a66b;opacity:.6;margin:26px auto}
#start h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
  font-size:clamp(58px,16vw,104px);line-height:1;margin:0;letter-spacing:-.01em}
#start .sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;opacity:.7;margin:0}
#startBtn{margin-top:44px;min-width:180px;min-height:52px;padding:0 34px;border-radius:999px;background:transparent;
  color:#f4ece4;border:1px solid rgba(244,236,228,.45);font-size:13px;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;transition:background .3s,border-color .3s,opacity .3s}
#startBtn:not([disabled]):hover,#startBtn:not([disabled]):active{background:rgba(244,236,228,.08);border-color:#c9a66b}
#startBtn[disabled]{opacity:.4}
#start .loading{margin-top:18px;font-size:12px;opacity:.5;min-height:16px;letter-spacing:.04em}
#start .note{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 22px);font-size:11px;letter-spacing:.12em;opacity:.38}

/* Letter */
.letterStage{position:relative;width:min(92vw,420px);display:flex;flex-direction:column;align-items:center}
.envelope{position:absolute;left:50%;top:50%;width:min(80vw,320px);height:min(52vw,210px);transform:translate(-50%,-50%);
  transition:transform .8s,opacity .7s;z-index:3}
.envelope .back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#fbe3d6,#f1c4b5);
  box-shadow:0 20px 50px rgba(50,10,30,.4)}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:60%;transform-origin:top;transition:transform .8s .1s;
  clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(180deg,#f6cfc0,#eab3a3);z-index:3}
.envelope .front{position:absolute;inset:0;border-radius:10px;z-index:2;
  background:linear-gradient(200deg,#f9dccf,#f0bcae);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.envelope .seal{position:absolute;left:50%;top:52%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#e0475f,#9c1a32);color:#ffd7c4;display:flex;align-items:center;
  justify-content:center;font-size:24px;box-shadow:0 4px 10px rgba(80,0,20,.4);transition:opacity .4s}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal{opacity:0}
.envelope.gone{transform:translate(-50%,60vh) scale(.8);opacity:0;pointer-events:none}
.letter{position:relative;width:100%;padding:28px 24px 22px;border-radius:14px;color:#4a2a36;text-align:center;
  background:linear-gradient(180deg,#fffdf8,#fff3e6);
  box-shadow:0 24px 60px rgba(40,5,25,.45),inset 0 0 0 1px #f3dccb,inset 0 0 0 7px #fffdf8,inset 0 0 0 8px #efd3bd;
  transform:translateY(40px) scale(.6);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.25,1.1),opacity .6s}
.letter.show{transform:none;opacity:1}
.letter .stamp{position:absolute;top:12px;right:14px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#c2416f;
  border:1.5px dashed #e7a3b8;padding:4px 7px;border-radius:5px;transform:rotate(4deg)}
.letter .hello{font-family:'Great Vibes',cursive;font-size:44px;margin:10px 0 0;line-height:1.1;color:#b0305a}
.letter .ask{font-family:'Great Vibes',cursive;font-size:38px;margin:2px 0 12px;line-height:1.15;color:#4a2a36}
.letter .subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.38;margin:0 4px 6px;color:#6b4756}
.letter .sign{font-family:'Great Vibes',cursive;font-size:30px;margin:4px 0 14px;color:#b0305a}
.tease{min-height:26px;font-weight:800;font-size:15px;color:#c2416f;margin-bottom:10px;transition:opacity .2s}
.choices{display:flex;gap:14px;justify-content:center;align-items:center;min-height:64px}
.choices .btn.yes{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}

/* Menu */
.menuCard{width:min(94vw,430px);max-height:100%;overflow:auto;touch-action:pan-y;border-radius:20px;color:#3b2430;
  background:linear-gradient(180deg,#fffaf1,#f9ecd9);box-shadow:0 26px 70px rgba(30,5,20,.5);
  transform:translateY(30px) scale(.94);transition:transform .5s cubic-bezier(.2,.9,.3,1.15)}
.overlay.show .menuCard,.overlay.show .card{transform:none}
.menuHead{background:linear-gradient(135deg,#1f4a3a,#2c5e4b);color:#fbe9c6;text-align:center;padding:16px 12px 12px;
  border-bottom:4px double #d8b46a}
.menuHead .cafe{font-family:'Great Vibes',cursive;font-size:42px;line-height:1}
.menuHead .since{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;opacity:.85;margin-top:4px}
.menuBody{padding:14px 14px 18px}
.menuBody h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:22px;margin:4px 4px 8px;
  display:flex;align-items:center;gap:8px;color:#2c5e4b}
.menuBody h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#d8b46a,transparent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt{border:2px solid #ead8bd;background:#fffdf8;border-radius:16px;padding:10px 8px 12px;text-align:center;color:#3b2430;
  transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;min-height:150px}
.opt svg{width:66px;height:66px;display:block;margin:2px auto 4px}
.opt b{display:block;font-size:16px;font-weight:900}
.opt small{display:block;font-size:12px;opacity:.7;margin-top:2px;font-weight:700}
.opt.sel{border-color:#ff6f9c;background:#fff0f4;box-shadow:0 8px 20px rgba(255,111,156,.25);transform:translateY(-2px)}
.opt.sel b:after{content:" ✓";color:#ff6f9c}
.menuFoot{text-align:center;padding-top:4px}

/* Generic card */
.card{width:min(92vw,420px);border-radius:22px;padding:24px 20px 20px;text-align:center;color:#3b2430;
  background:linear-gradient(180deg,#fffdf8,#fff1e6);box-shadow:0 26px 70px rgba(30,5,20,.5);
  transform:translateY(30px) scale(.94);transition:transform .5s cubic-bezier(.2,.9,.3,1.15)}
.card.night{background:linear-gradient(180deg,rgba(40,18,52,.92),rgba(26,12,38,.94));color:#fff;
  box-shadow:0 26px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(243,196,107,.45)}
.card .ring{font-size:56px;animation:floaty 2.6s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,230,160,.8))}
.card .who{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;margin-top:4px;color:#f3c46b}
.card .big{font-family:'Great Vibes',cursive;font-size:clamp(44px,13vw,58px);line-height:1.1;margin:4px 0 8px}
.card p{font-size:15px;line-height:1.45;margin:6px 0 12px;font-weight:700;opacity:.9}

/* Painting */
.paintWrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(92vw,420px)}
.easelFrame{width:min(78vw,340px,calc((100dvh - 230px) * .75));aspect-ratio:3/4;padding:12px;border-radius:6px;
  background:linear-gradient(135deg,#d9a956,#9c6b25 40%,#e8c27a 60%,#a5742b);
  box-shadow:0 24px 60px rgba(20,5,10,.55),inset 0 0 0 3px rgba(255,235,190,.4)}
.easelFrame canvas{width:100%;height:100%;display:block;background:#f5efe4;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.paintStatus{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;min-height:28px;text-align:center;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
.paintBar{width:min(70vw,280px);height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}
.paintBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a6b,#ff5c8d)}

/* Certificate */
.certWrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;height:100%;justify-content:center}
.certWrap .title{font-family:'Great Vibes',cursive;font-size:40px;line-height:1;text-shadow:0 3px 16px rgba(0,0,0,.5)}
.certImg{max-width:min(90vw,520px);max-height:calc(100dvh - 230px);border-radius:10px;
  box-shadow:0 26px 70px rgba(0,0,0,.6);background:#fff7ea;touch-action:auto;-webkit-touch-callout:default;
  -webkit-user-select:auto;user-select:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.saveModal .card{max-height:100%;overflow:auto;touch-action:pan-y}
.saveModal img{width:100%;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);-webkit-touch-callout:default;
  -webkit-user-select:auto;user-select:auto;touch-action:auto;margin:6px 0 10px}
.saveModal .hint{font-size:14px;font-weight:800;color:#c2416f;margin:0 0 12px}
.saveModal a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}

/* Landing HUD */
#landHud{position:absolute;inset:0;z-index:32;pointer-events:none;display:none}
#landHud.show{display:block}
#landHud .top{position:absolute;top:calc(var(--st) + 66px);left:12px;right:12px;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px}
#landHud .info{background:rgba(25,12,30,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:8px 12px;font-weight:800;font-size:13px;line-height:1.5}
#landHud .info b{color:var(--gold)}
#ils{width:92px;height:92px;border-radius:16px;background:rgba(25,12,30,.45);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);position:relative}
#ils:before{content:"";position:absolute;left:50%;top:10px;bottom:10px;width:1px;background:rgba(255,255,255,.25)}
#ils:after{content:"";position:absolute;top:50%;left:10px;right:10px;height:1px;background:rgba(255,255,255,.25)}
#ils .tgt{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:2px solid var(--gold);box-shadow:0 0 12px rgba(243,196,107,.6)}
#ils .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:#ff6f9c;box-shadow:0 0 10px #ff6f9c;transition:background .2s}
#ils .lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;font-weight:900;letter-spacing:.1em;
  opacity:.85;text-shadow:0 1px 4px #000}
#landHint{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:22px;
  text-shadow:0 3px 14px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;white-space:nowrap}
#landHint.warn{color:#ffd36b}
#landHint.show{opacity:1}
#dpad{position:absolute;right:14px;bottom:calc(var(--sb) + 18px);display:grid;grid-template-columns:repeat(3,58px);
  grid-template-rows:repeat(2,58px);gap:6px;pointer-events:auto}
#dpad button{border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(25,12,30,.45);color:#fff;font-size:22px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none}
#dpad button.on{background:rgba(255,111,156,.65)}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .d{grid-column:2;grid-row:2}#dpad .r{grid-column:3;grid-row:2}
#landHud .dragNote{position:absolute;left:16px;bottom:calc(var(--sb) + 26px);font-size:12px;font-weight:800;opacity:.85;
  max-width:42vw;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.08);display:none;z-index:31;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:rgba(255,111,156,.75);box-shadow:0 0 14px rgba(255,111,156,.7)}

/* Flight map */
#flightMap{position:absolute;left:50%;top:calc(var(--st) + 82px);transform:translateX(-50%) translateY(-12px);z-index:31;
  width:min(92vw,420px);padding:10px 12px 8px;border-radius:18px;background:rgba(30,14,36,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);opacity:0;transition:.6s;
  pointer-events:none}
#flightMap.show{opacity:1;transform:translateX(-50%)}
#flightMap svg{width:100%;height:auto;display:block}
#flightMap .row2{display:flex;justify-content:space-between;font-size:12px;font-weight:800;letter-spacing:.06em;margin-top:2px}
#flightMap .row2 b{color:var(--gold)}

/* FX */
.fx{position:absolute;pointer-events:none;z-index:70;will-change:transform,opacity}
.fx.heart{animation:floatUp 2.4s ease-out forwards}
.fx.conf{width:9px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:72;text-align:center;
  opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,1.4,.4,1);pointer-events:none;width:92vw}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast .t1{font-family:'Great Vibes',cursive;font-size:clamp(48px,15vw,90px);line-height:1.05;
  text-shadow:0 4px 30px rgba(0,0,0,.55),0 0 30px rgba(255,120,160,.5)}
.toast .t2{font-weight:900;font-size:16px;letter-spacing:.08em;margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.6)}

@keyframes pulse{0%,100%{box-shadow:0 12px 34px rgba(255,90,140,.5)}50%{box-shadow:0 12px 44px rgba(255,90,140,.85),0 0 0 8px rgba(255,111,156,.18)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes floatUp{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:1;transform:translate(0,-20px) scale(1)}
  100%{transform:translate(var(--dx),-280px) scale(1.15) rotate(var(--rot));opacity:0}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>

<script type="module">
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║                    💌  PERSONALISE YOUR GAME HERE  💌                 ║
   ╠══════════════════════════════════════════════════════════════════════╣
   ║ PHOTOS — each slot accepts either:                                    ║
   ║   • a file name/URL next to this .html, e.g.  'photos/aidana.jpg'     ║
   ║   • a data URI  'data:image/jpeg;base64,....'                         ║
   ║   • EMBEDDED.xxx → the photos already baked into the bottom of file   ║
   ║   • ''  (empty) → a cute illustrated placeholder is drawn instead     ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
const EMBEDDED = window.EMBEDDED_PHOTOS || {};

const CONFIG = {
  // 📸 [AIDANA_PHOTO] / [LEO_PHOTO] — optional, not shown anywhere in this version
  aidanaPhoto: '',
  leoPhoto: '',
  // 📸 [COUPLE_PHOTO] — a photo of the two of you (street-artist portrait + certificate)
  couplePhoto: EMBEDDED.couple || '',

  // 🔤 [INITIALS] — engraved on the love lock and stamped on the wax seal
  initials: 'A + L',

  herName: 'Aidana',
  hisName: 'Léo',
  herCity: 'Almaty',
  hisCity: 'Paris',
  distanceKm: 5550,

  // 🎨 Character looks (hex colours) — tweak to match your reference photos
  looks: {
    aidana: { skin: '#f4d3bf', hair: '#2b1a13', hairHi: '#4b2e20', top: '#121014', jacket: '#8d8b92',
              trim: '#141217', skirt: '#7f7d84', legs: '#1a191e', shoe: '#121014', lips: '#c45f74', eyes: '#1c1210' },
    leo:    { skin: '#f1ceb4', hair: '#5b3920', top: '#ffffff', jacket: '#1d2741', trousers: '#232a3b',
              shoe: '#3b2518', beard: '#4a2d1b', lips: '#b36a68', eyes: '#2a1b14' },
  },

  // Three.js CDNs (tried in order). Everything falls back to 2D if 3D is unavailable.
  threeCDN: [
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
    'https://unpkg.com/three@0.160.0/build/three.module.js',
  ],
};
/* ════════════════════════════ end of personalisation ═══════════════════ */

// ---------------------------------------------------------------------------
// Small utilities
// ---------------------------------------------------------------------------
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const sleepReal = ms => new Promise(r => setTimeout(r, ms));
const Ease = {
  linear: t => t,
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  outBack: t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  sine: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
const KM = CONFIG.distanceKm.toLocaleString('en-US');

// ---------------------------------------------------------------------------
// Game clock + tweens (game-time based, pauses with the tab)
// ---------------------------------------------------------------------------
const E = { time: 0, tweens: [], last: performance.now() };
function tween(dur, fn, ease = Ease.inOut) {
  return new Promise(res => {
    if (dur <= 0) { fn && fn(1); res(); return; }
    E.tweens.push({ t: 0, dur, fn, ease, res });
  });
}
const wait = s => tween(s, null, Ease.linear);
function updateTweens(dt) {
  for (let i = E.tweens.length - 1; i >= 0; i--) {
    const tw = E.tweens[i];
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    try { tw.fn && tw.fn(tw.ease(k)); } catch (e) { console.warn('[tween]', e); tw.t = tw.dur; }
    if (k >= 1) { E.tweens.splice(i, 1); tw.res(); }
  }
}

// ---------------------------------------------------------------------------
// Images (photos) — loaded once, used by DOM, canvas and 3D
// ---------------------------------------------------------------------------
const IMG = {};
function loadImage(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const im = new Image();
    if (!src.startsWith('data:')) im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
  });
}
async function loadPhotos() {
  const [a, l, c] = await Promise.all([loadImage(CONFIG.aidanaPhoto), loadImage(CONFIG.leoPhoto), loadImage(CONFIG.couplePhoto)]);
  IMG.aidana = a; IMG.leo = l; IMG.couple = c;
}
function avatarCSS(who) {
  const im = IMG[who];
  return im ? `url("${im.src}")` : '';
}

// ---------------------------------------------------------------------------
// Audio — gentle generative music + sound effects (Web Audio API)
// ---------------------------------------------------------------------------
const Sound = {
  ctx: null, master: null, music: null, sfx: null, rev: null, noiseBuf: null,
  muted: false, musicOn: false, timer: null, engine: null,
  init() {
    if (this.ctx) { this.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.9;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3;
      this.master.connect(comp); comp.connect(c.destination);
      this.music = c.createGain(); this.music.gain.value = 0; this.music.connect(this.master);
      this.sfx = c.createGain(); this.sfx.gain.value = 0.75; this.sfx.connect(this.master);
      this.rev = c.createConvolver(); this.rev.buffer = this.impulse(2.6, 2.4);
      const rg = c.createGain(); rg.gain.value = 0.32; this.rev.connect(rg); rg.connect(this.master);
      const len = c.sampleRate * 2, nb = c.createBuffer(1, len, c.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = nb;
      document.addEventListener('visibilitychange', () => {
        if (!this.ctx) return;
        if (document.hidden) this.ctx.suspend().catch(() => {}); else this.resume();
      });
    } catch (e) { console.warn('Audio unavailable', e); this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); },
  impulse(sec, decay) {
    const c = this.ctx, len = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('al_muted', m ? '1' : '0'); } catch (e) {}
    if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.08);
  },
  tone({ f, at = null, t = 0, d = 0.5, type = 'sine', v = 0.2, a = 0.01, bus = null, rev = 0.25, f2 = null }) {
    const c = this.ctx; if (!c) return;
    const t0 = (at ?? c.currentTime) + t;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(v, 0.0002), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(bus || this.sfx);
    if (rev) { const s = c.createGain(); s.gain.value = rev; g.connect(s); s.connect(this.rev); }
    o.start(t0); o.stop(t0 + d + 0.05);
  },
  noise({ t = 0, d = 0.4, v = 0.2, type = 'lowpass', f = 1200, f2 = null, q = 0.8, a = 0.01, rev = 0.1 }) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + t;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(fl); fl.connect(g); g.connect(this.sfx);
    if (rev) { const r = c.createGain(); r.gain.value = rev; g.connect(r); r.connect(this.rev); }
    s.start(t0, Math.random()); s.stop(t0 + d + 0.05);
  },
  midi: n => 440 * Math.pow(2, (n - 69) / 12),
  // --- SFX library ---
  chime() { [1318.5, 1568, 2093, 2637].forEach((f, i) => this.tone({ f, t: i * 0.08, d: 1.6, v: 0.09, rev: 0.7 })); },
  sparkle() { for (let i = 0; i < 7; i++) this.tone({ f: rand(1800, 3600), t: i * 0.045, d: 0.3, v: 0.04, rev: 0.6 }); },
  pop() { this.tone({ f: 520, f2: 980, d: 0.14, v: 0.12, type: 'sine', rev: 0.1 }); },
  tap() { this.tone({ f: 880, d: 0.08, v: 0.05, type: 'triangle', rev: 0.05 }); },
  whoosh() { this.noise({ d: 0.7, v: 0.18, type: 'bandpass', f: 400, f2: 2400, q: 1.2, a: 0.2 }); },
  boing() { this.tone({ f: 420, f2: 160, d: 0.35, v: 0.13, type: 'sine', rev: 0.05 }); this.tone({ f: 630, f2: 240, d: 0.3, v: 0.05, type: 'triangle' }); },
  doorbell() { this.tone({ f: 659.3, d: 1.4, v: 0.18, type: 'sine', rev: 0.5 }); this.tone({ f: 523.3, t: 0.55, d: 1.8, v: 0.18, type: 'sine', rev: 0.5 }); },
  click() { this.noise({ d: 0.06, v: 0.3, type: 'highpass', f: 2500, rev: 0.05 }); this.tone({ f: 1900, d: 0.06, v: 0.06, type: 'square', rev: 0 }); },
  splash() { this.noise({ d: 0.9, v: 0.22, type: 'lowpass', f: 2200, f2: 300, a: 0.01, rev: 0.4 }); this.tone({ f: 300, f2: 120, d: 0.25, v: 0.12 }); },
  thud() { this.tone({ f: 110, f2: 45, d: 0.5, v: 0.35, type: 'sine', rev: 0.1 }); this.noise({ d: 0.35, v: 0.15, f: 600, f2: 120 }); },
  boom() { this.tone({ f: 90, f2: 35, d: 1.1, v: 0.25, rev: 0.5 }); this.noise({ d: 1.2, v: 0.12, f: 900, f2: 100, rev: 0.6 });
           for (let i = 0; i < 6; i++) this.noise({ t: 0.25 + rand(0, 0.6), d: 0.05, v: 0.06, type: 'highpass', f: 3000 }); },
  brush() { this.noise({ d: 0.35, v: 0.05, type: 'bandpass', f: rand(1500, 3000), q: 0.6, a: 0.12, rev: 0 }); },
  fanfare() { [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => this.tone({ f: this.midi(n + 5), t: i * 0.09, d: 1.4, v: 0.08, type: 'triangle', rev: 0.6 })); },
  heart() { this.tone({ f: 784, d: 0.5, v: 0.08, rev: 0.5 }); this.tone({ f: 1046.5, t: 0.1, d: 0.7, v: 0.08, rev: 0.5 }); },
  warn() { this.tone({ f: 740, d: 0.12, v: 0.08, type: 'square', rev: 0 }); this.tone({ f: 740, t: 0.18, d: 0.12, v: 0.08, type: 'square', rev: 0 }); },
  startEngine(level = 0.5) {
    const c = this.ctx; if (!c) return;
    this.stopEngine();
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 380;
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 72;
    const of = c.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 240;
    const og = c.createGain(); og.gain.value = 0.05;
    const g = c.createGain(); g.gain.value = 0.0001;
    s.connect(fl); fl.connect(g); o.connect(of); of.connect(og); og.connect(g); g.connect(this.sfx);
    s.start(); o.start();
    g.gain.setTargetAtTime(0.16 * level, c.currentTime, 0.6);
    this.engine = { s, o, g, fl,
      set: (lv, pitch = 1) => { try { g.gain.setTargetAtTime(0.16 * lv, c.currentTime, 0.4); fl.frequency.setTargetAtTime(380 * pitch, c.currentTime, 0.4); o.frequency.setTargetAtTime(72 * pitch, c.currentTime, 0.4); } catch (e) {} } };
  },
  stopEngine() {
    if (!this.engine || !this.ctx) return;
    const e = this.engine, c = this.ctx; this.engine = null;
    e.g.gain.setTargetAtTime(0.0001, c.currentTime, 0.5);
    setTimeout(() => { try { e.s.stop(); e.o.stop(); } catch (er) {} }, 2500);
  },
  // --- Generative romantic music: I–vi–IV–V in F with a music-box arpeggio ---
  startMusic() {
    const c = this.ctx; if (!c || this.musicOn) return;
    this.musicOn = true;
    this.music.gain.setTargetAtTime(0.55, c.currentTime, 2.5);
    const prog = [[53, 57, 60, 64], [50, 53, 57, 60], [46, 50, 53, 57], [48, 52, 55, 58]];
    const pat = [0, 1, 2, 3, 2, 1, 3, 2];
    const melody = [77, null, 76, 74, null, 72, null, null, 74, null, 72, 69, null, 72, null, null,
                    70, null, 69, 65, null, 69, null, 70, 72, null, null, 70, 67, null, null, null];
    const beat = 60 / 74;
    let next = c.currentTime + 0.15, step = 0;
    const sched = () => {
      while (next < c.currentTime + 0.5) {
        const bar = Math.floor(step / 8) % 4, s8 = step % 8, chord = prog[bar];
        if (s8 === 0) {
          chord.forEach(n => this.tone({ f: this.midi(n), at: next, d: beat * 4.3, v: 0.026, type: 'triangle', a: 0.9, bus: this.music, rev: 0.55 }));
          this.tone({ f: this.midi(chord[0] - 12), at: next, d: beat * 3.9, v: 0.07, type: 'sine', a: 0.25, bus: this.music, rev: 0.2 });
        }
        const n = chord[pat[s8]] + 12;
        this.tone({ f: this.midi(n), at: next, d: 1.3, v: 0.03, type: 'sine', a: 0.005, bus: this.music, rev: 0.6 });
        this.tone({ f: this.midi(n) * 2, at: next, d: 0.5, v: 0.007, type: 'sine', a: 0.005, bus: this.music, rev: 0.6 });
        const m = melody[step % 32];
        if (m && Math.floor(step / 32) % 2 === 1) this.tone({ f: this.midi(m), at: next, d: beat * 1.8, v: 0.034, type: 'triangle', a: 0.04, bus: this.music, rev: 0.7 });
        next += beat / 2; step++;
      }
    };
    sched();
    this.timer = setInterval(sched, 120);
  },
  duck(level = 0.25, sec = 2) {
    if (!this.ctx || !this.musicOn) return;
    const t = this.ctx.currentTime;
    this.music.gain.setTargetAtTime(level, t, 0.2);
    this.music.gain.setTargetAtTime(0.55, t + sec, 0.8);
  },
};

// ---------------------------------------------------------------------------
// UI helpers: banner, dialogue, prompt, fades, overlays, FX
// ---------------------------------------------------------------------------
const CHAPTERS = [
  { title: 'The Invitation', sub: 'Almaty · a quiet afternoon' },
  { title: 'Flight to Paris', sub: `${KM} km of sky between us` },
  { title: 'Coffee in Paris', sub: 'A little café, just for two' },
  { title: 'The Love Lock', sub: 'A bridge over the Seine at golden hour' },
  { title: 'A Portrait of Us', sub: 'A stroll through the old streets' },
  { title: 'Under the Paris Lights', sub: 'The evening sparkles' },
  { title: 'Forever, Officially', sub: 'A keepsake for us' },
];
function buildProgress() {
  $('#progress').innerHTML = CHAPTERS.map(() => '<span>♥</span>').join('');
}
function setProgress(i) {
  [...$('#progress').children].forEach((s, k) => { s.className = k < i ? 'done' : k === i ? 'now' : ''; });

const SPEAKERS = {
  aidana: () => ({ name: CONFIG.herName, mono: CONFIG.herName[0], cls: 'her' }),
  leo: () => ({ name: CONFIG.hisName, mono: CONFIG.hisName[0], cls: 'leo' }),
  artist: () => ({ name: 'The Street Artist', mono: '🎨', cls: 'emoji' }),
  pilot: () => ({ name: 'Captain’s Radio', mono: '✈️', cls: 'emoji' }),
  narr: () => null,
};
function say(who, text) {
  return new Promise(res => {
    const d = $('#dialogue'), av = d.querySelector('.avatar'), nm = d.querySelector('.name'), tx = d.querySelector('.text');
    const sp = SPEAKERS[who] ? SPEAKERS[who]() : null;
    d.classList.toggle('narr', !sp);
    if (sp) {
      av.className = 'avatar ' + sp.cls;
      av.textContent = sp.mono;
      nm.textContent = sp.name;
    } else { av.className = 'avatar none'; nm.textContent = ''; }
    tx.textContent = '';
    d.classList.remove('ready');
    d.classList.add('show');
    const layer = $('#tapLayer'); layer.style.display = 'block';
    let i = 0, done = false, timer = null;
    const finishTyping = () => { done = true; clearInterval(timer); tx.textContent = text; d.classList.add('ready'); };
    timer = setInterval(() => {
      i += 1; tx.textContent = text.slice(0, i);
      if (i % 3 === 0) Sound.tone({ f: who === 'leo' ? 330 : who === 'aidana' ? 520 : 420, d: 0.04, v: 0.012, type: 'triangle', rev: 0 });
      if (i >= text.length) finishTyping();
    }, 26);
    const onTap = e => {
      e.preventDefault();
      if (!done) { finishTyping(); return; }
      layer.removeEventListener('pointerup', onTap);
      window.removeEventListener('keydown', onKey);
      layer.style.display = 'none';
      Sound.tap();
      res();
    };
    const onKey = e => { if (e.key === 'Enter' || e.key === ' ') onTap(e); };
    layer.addEventListener('pointerup', onTap);
    window.addEventListener('keydown', onKey);
  });
}
async function talk(lines) { for (const [w, t] of lines) await say(w, t); hideDialogue(); }
function hideDialogue() { $('#dialogue').classList.remove('show', 'ready'); }

// ---------------------------------------------------------------------------
// 3D ENGINE (Three.js) — with graceful 2D fallback
// ---------------------------------------------------------------------------
let THREE = null;
const GL = { ok: false, renderer: null, camera: null, cur: null, ray: null, ndc: null, env: null };
const CAM = { pos: null, look: null, base: null, curLook: null, follow: null, smooth: 3.2, sway: 1, shake: 0 };

function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
}
async function loadThree() {
  for (const url of CONFIG.threeCDN) {
    try { const m = await import(url); if (m && m.WebGLRenderer) return m; } catch (e) { /* try the next CDN */ }
  }
  return null;
}
function computeFov(aspect) {
  const v = 2 * Math.atan(Math.tan(20 * Math.PI / 180) / aspect) * 180 / Math.PI;
  return clamp(v, 45, 70);
}
function resizeGL() {
  if (!GL.renderer) return;
  const el = $('#app'), w = el.clientWidth || innerWidth, h = el.clientHeight || innerHeight;
  GL.renderer.setSize(w, h, false);
  GL.camera.aspect = w / h;
  GL.camera.fov = computeFov(w / h);
  GL.camera.updateProjectionMatrix();
}
async function initGL() {
  if (!hasWebGL()) return false;
  THREE = await loadThree();
  if (!THREE) return false;
  try {
    const canvas = $('#gl');
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    r.outputColorSpace = THREE.SRGBColorSpace;
    r.setClearColor(0x1b1020, 1);
    GL.renderer = r;
    GL.camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2600);
    GL.ray = new THREE.Raycaster();
    GL.ndc = new THREE.Vector2();
    CAM.pos = new THREE.Vector3(0, 2, 6); CAM.look = new THREE.Vector3(0, 1, 0);
    CAM.base = CAM.pos.clone(); CAM.curLook = CAM.look.clone();
    resizeGL();
    window.addEventListener('resize', resizeGL);
    canvas.addEventListener('webglcontextlost', e => e.preventDefault());
    try { GL.env = makeEnvMap(); } catch (e) { GL.env = null; }
    GL.ok = true;
    return true;
  } catch (e) {
    console.warn('WebGL init failed — using the 2D version.', e);
    GL.ok = false; return false;
  }
}

const _v = { look: null };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - E.last) / 1000));
  E.last = now; E.time += dt;
  updateTweens(dt);
  if (!GL.ok || !GL.cur) return;
  const S = GL.cur;
  if (S.update && !S._broken) {
    try { S.update(dt, E.time); } catch (e) { S._broken = true; console.warn('[scene update]', e); }
  }
  for (const ch of S.chars) { try { ch.update(dt, E.time); } catch (e) { /* keep going */ } }
  updateCamera(dt);
  if (S.sky) S.sky.position.copy(GL.camera.position);
  GL.renderer.render(S.scene, GL.camera);
}
function updateCamera(dt) {
  const cam = GL.camera;
  if (CAM.follow) {
    try { const f = CAM.follow(); CAM.pos.copy(f.pos); CAM.look.copy(f.look); } catch (e) { CAM.follow = null; }
  }
  const k = 1 - Math.exp(-CAM.smooth * dt);
  CAM.base.lerp(CAM.pos, k);
  CAM.curLook.lerp(CAM.look, k);
  cam.position.copy(CAM.base);
  if (CAM.shake > 0) {
    cam.position.x += rand(-1, 1) * CAM.shake; cam.position.y += rand(-1, 1) * CAM.shake;
    CAM.shake *= Math.exp(-dt * 5); if (CAM.shake < 0.002) CAM.shake = 0;
  }
  if (!_v.look) _v.look = new THREE.Vector3();
  const t = E.time, s = CAM.sway;
  _v.look.set(CAM.curLook.x + Math.sin(t * 0.37) * 0.05 * s, CAM.curLook.y + Math.sin(t * 0.53) * 0.035 * s, CAM.curLook.z);
  cam.lookAt(_v.look);
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
function camSet(p, l) {
  if (!GL.ok) return;
  CAM.follow = null; CAM.pos.copy(p); CAM.look.copy(l); CAM.base.copy(p); CAM.curLook.copy(l);
  GL.camera.position.copy(p); GL.camera.lookAt(l);
}
function camTo(p, l, dur = 2, ease = Ease.inOut) {
  if (!GL.ok) return Promise.resolve();
  CAM.follow = null;
  const p0 = CAM.pos.clone(), l0 = CAM.look.clone();
  return tween(dur, k => { CAM.pos.lerpVectors(p0, p, k); CAM.look.lerpVectors(l0, l, k); }, ease);
}

function disposeScene(sc) {
  sc.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const m = o.material;
    if (m) (Array.isArray(m) ? m : [m]).forEach(mm => {
      for (const key in mm) { const v = mm[key]; if (v && v.isTexture && key !== 'envMap') v.dispose(); }
      mm.dispose();
    });
  });
}
function useScene(S) {
  if (GL.cur && GL.cur !== S) { try { disposeScene(GL.cur.scene); } catch (e) {} }
  GL.cur = S;
  if (S) setFallback(null);
}
// Build a scene safely; if anything goes wrong we show the pretty 2D fallback instead.
function enter(builder, fallbackKind) {
  if (!GL.ok) { useScene(null); setFallback(fallbackKind); return null; }
  try { const S = builder(); useScene(S); return S; }
  catch (e) { console.warn('[3D] scene failed — showing 2D version', e); useScene(null); setFallback(fallbackKind); return null; }
}
// Run a 3D-only step; never lets a 3D hiccup break the story.
async function act(S, fn) {
  if (!S || !GL.ok) return;
  try { return await fn(); } catch (e) { console.warn('[3D step]', e); }
}

// Tap on 3D objects (with a forgiving fallback: tapping the prompt or missing a few times also works)
function waitTap3D(S, targets, text) {
  return new Promise(res => {
    showPrompt(text);
    const canvas = $('#gl'), fb = $('#fallbackBg'), pr = $('#prompt');
    let misses = 0, done = false;
    const finish = () => {
      if (done) return; done = true;
      canvas.removeEventListener('pointerdown', onDown); fb.removeEventListener('pointerdown', finish); pr.removeEventListener('click', finish);
      hidePrompt(); Sound.pop(); res();
    };
    const onDown = e => {
      if (!S || !GL.ok) { finish(); return; }
      try {
        const r = canvas.getBoundingClientRect();
        GL.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
        GL.ray.setFromCamera(GL.ndc, GL.camera);
        const hits = GL.ray.intersectObjects(targets.filter(Boolean), true);
        if (hits.length > 0) { finish(); return; }
      } catch (err) { finish(); return; }
      misses++; Sound.tap();
      if (misses >= 2) finish();
    };
    canvas.addEventListener('pointerdown', onDown);
    fb.addEventListener('pointerdown', finish);
    pr.addEventListener('click', finish);
  });
}

// ---------------------------------------------------------------------------
// Materials, textures & small builders
// ---------------------------------------------------------------------------
let TX = {};                        // per-scene cache (textures / geometries / materials)
const cache = (k, fn) => (TX[k] ??= fn());
const LM = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
const SM = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const BM = (color, o = {}) => new THREE.MeshBasicMaterial({ color, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = null) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (parent) parent.add(m); return m;
}
function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(clamp(p < 0 ? v * (1 + p) : v + (255 - v) * p, 0, 255));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function ctex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h, c);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (opt.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opt.repeat[0], opt.repeat[1]); }
  if (opt.noMip) { t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; }
  t.anisotropy = opt.aniso || 4;
  t.userData.canvas = c;
  return t;
}
const glowTex = () => cache('glow', () => ctex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)');
  gr.addColorStop(0.6, 'rgba(255,255,255,.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
}));
function glow(color, scale, parent, x = 0, y = 0, z = 0, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color, transparent: true, opacity,
    depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  s.scale.set(scale, scale, 1); s.position.set(x, y, z); if (parent) parent.add(s); return s;
}
const shadowMat = () => cache('shadowMat', () => new THREE.MeshBasicMaterial({
  map: ctex(64, 64, (g, w) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(20,8,10,.55)'); gr.addColorStop(1, 'rgba(20,8,10,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, w); }),
  transparent: true, depthWrite: false }));
function blobShadow(parent, r = 0.42) {
  const m = mesh(cache('shadowGeo', () => new THREE.CircleGeometry(1, 24)), shadowMat(), 0, 0.015, 0, parent);
  m.rotation.x = -Math.PI / 2; m.scale.set(r, r, r); m.renderOrder = 1; return m;
}
function labelTex(text, { w = 512, h = 128, font = '700 64px "Cormorant Garamond", serif', color = '#fff', bg = null, stroke = null } = {}) {
  return ctex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 6; g.strokeText(text, w / 2, h / 2 + 4); }
    g.fillStyle = color; g.fillText(text, w / 2, h / 2 + 4);
  });
}
function makeSky({ stops, sunDir = null, sunColor = '#ffd9a0', sunPower = 6, sunAmt = 0.5, radius = 900 }) {
  const geo = new THREE.SphereGeometry(radius, 48, 24);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const cs = stops.map(([h, c]) => [h, new THREE.Color(c)]);
  const sc = new THREE.Color(sunColor), sd = sunDir ? V3(...sunDir).normalize() : null;
  const tmp = new THREE.Color(), v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
    const h = v.y;
    if (h <= cs[0][0]) tmp.copy(cs[0][1]);
    else if (h >= cs[cs.length - 1][0]) tmp.copy(cs[cs.length - 1][1]);
    else for (let j = 0; j < cs.length - 1; j++) {
      if (h >= cs[j][0] && h <= cs[j + 1][0]) { tmp.copy(cs[j][1]).lerp(cs[j + 1][1], (h - cs[j][0]) / (cs[j + 1][0] - cs[j][0])); break; }
    }
    if (sd) tmp.lerp(sc, Math.pow(Math.max(0, v.dot(sd)), sunPower) * sunAmt);
    cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
  m.renderOrder = -10; m.frustumCulled = false;
  return m;
}
function makeEnvMap() {
  const s = new THREE.Scene();
  s.add(makeSky({ stops: [[-1, '#2a1a1a'], [-0.1, '#8a6a50'], [0.05, '#ffd9a8'], [0.4, '#fff1dc'], [1, '#ffffff']], radius: 50 }));
  const pm = new THREE.PMREMGenerator(GL.renderer);
  const rt = pm.fromScene(s, 0.04);
  pm.dispose();
  return rt.texture;
}
const goldMat = () => cache('gold', () => SM('#e9b44c', { metalness: 0.85, roughness: 0.28, envMap: GL.env, envMapIntensity: 1.3, emissive: '#3a2400', emissiveIntensity: 0.4 }));

function newWorld({ fog = null, fogNear = 20, fogFar = 400, sky = null, hemi = ['#ffffff', '#806060', 1.6], sun = ['#fff1dc', 2.2], sunPos = [10, 20, 10] }) {
  TX = {};
  const scene = new THREE.Scene();
  if (fog) scene.fog = new THREE.Fog(fog, fogNear, fogFar);
  const S = { scene, chars: [], update: null, sky: null, fx: [] };
  if (sky) { S.sky = makeSky(sky); scene.add(S.sky); }
  S.hemi = new THREE.HemisphereLight(hemi[0], hemi[1], hemi[2]); scene.add(S.hemi);
  S.sun = new THREE.DirectionalLight(sun[0], sun[1]); S.sun.position.set(...sunPos); scene.add(S.sun);
  return S;
}
function addSun(S, dir, color = '#ffd28a', size = 220) {
  const d = V3(...dir).normalize().multiplyScalar(820);
  glow(color, size, S.sky, d.x, d.y, d.z, 0.95);
  glow('#ffffff', size * 0.22, S.sky, d.x, d.y, d.z, 1);
}
function addStars(S, n = 700) {
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = rand(0, Math.PI * 2), y = rand(0.05, 1), r = Math.sqrt(1 - y * y);
    pos[i * 3] = Math.cos(th) * r * 800; pos[i * 3 + 1] = y * 800; pos[i * 3 + 2] = Math.sin(th) * r * 800;
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: '#fff7e6', size: 2.2, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.9, depthWrite: false }));
  pts.frustumCulled = false; S.sky.add(pts); return pts;
}

// --- canvas texture painters ----------------------------------------------------------
function woodTex(base = '#b9825a', rep = [3, 3], rows = 8) {
  return ctex(512, 512, (g, w, h) => {
    for (let r = 0; r < rows; r++) {
      const y = r * h / rows, rh = h / rows;
      g.fillStyle = shade(base, rand(-0.12, 0.08)); g.fillRect(0, y, w, rh);
      g.strokeStyle = 'rgba(60,30,15,.13)'; g.lineWidth = 1.5;
      for (let k = 0; k < 9; k++) { g.beginPath(); const yy = y + rand(4, rh - 4); g.moveTo(0, yy); for (let x = 0; x <= w; x += 32) g.lineTo(x, yy + Math.sin(x * 0.02 + k) * 2); g.stroke(); }
      g.fillStyle = 'rgba(40,20,10,.45)'; g.fillRect(0, y, w, 2); g.fillRect(rand(0, w), y, 3, rh);
    }
  }, { repeat: rep });
}
function cobbleTex(rep, base = '#8d8379') {
  return ctex(512, 512, (g, w, h) => {
    g.fillStyle = '#5d554e'; g.fillRect(0, 0, w, h);
    const rows = 14, rh = h / rows;

// "IMPOSSIBLE NO" — the No button dodges, shrinks, teases… and finally gives up
// ---------------------------------------------------------------------------
function impossibleNo(ov, yesBtn, noBtn, teaseEl, teases, onYes) {
  let tries = 0, lastDodge = 0;
  const overlapR = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const dodge = e => {
    const now = performance.now();
    if (now - lastDodge < 250) return;
    lastDodge = now; tries++;
    Sound.boing();
    try { navigator.vibrate && navigator.vibrate(12); } catch (er) {}
    teaseEl.textContent = teases[Math.min(tries - 1, teases.length - 1)];
    const o = ov.getBoundingClientRect();
    if (!noBtn.classList.contains('dodger')) {
      const r = noBtn.getBoundingClientRect();
      noBtn.classList.add('dodger'); noBtn.style.left = (r.left - o.left) + 'px'; noBtn.style.top = (r.top - o.top) + 'px';
      ov.appendChild(noBtn); void noBtn.offsetWidth;
    }
    yesBtn.style.transform = `scale(${Math.min(1.45, 1 + tries * 0.07)})`;
    if (tries >= 7) {
      noBtn.textContent = 'Yes 💖'; noBtn.className = 'btn yes dodger'; noBtn.style.transform = 'scale(1.05)';
      noBtn.dataset.yes = '1'; teaseEl.textContent = 'Okay, okay… this button says yes too 😌';
      return;
    }
    noBtn.style.transform = `scale(${Math.max(0.55, 1 - tries * 0.08)})`;
    const b = noBtn.getBoundingClientRect(), y = yesBtn.getBoundingClientRect();
    const px = e && e.clientX != null ? e.clientX - o.left : -999, py = e && e.clientY != null ? e.clientY - o.top : -999;
    const yr = { x: y.left - o.left - 24, y: y.top - o.top - 24, w: y.width + 48, h: y.height + 48 };
    let x, yy, k = 0;
    do {
      x = rand(14, Math.max(16, o.width - b.width - 14)); yy = rand(o.height * 0.1, Math.max(o.height * 0.1 + 2, o.height - b.height - 24)); k++;
    } while (k < 60 && (overlapR({ x, y: yy, w: b.width, h: b.height }, yr) || Math.hypot(x + b.width / 2 - px, yy + b.height / 2 - py) < 150));
    noBtn.style.left = x + 'px'; noBtn.style.top = yy + 'px';
  };
  noBtn.addEventListener('pointerdown', e => { if (noBtn.dataset.yes) return; e.preventDefault(); e.stopPropagation(); dodge(e); });
  noBtn.addEventListener('pointerenter', e => { if (noBtn.dataset.yes || e.pointerType !== 'mouse') return; dodge(e); });
  noBtn.addEventListener('click', e => { e.preventDefault(); if (noBtn.dataset.yes) { onYes(); return; } dodge(null); });
  yesBtn.addEventListener('click', () => onYes());
}

function landingGame(S) {
  return new Promise(async res => {
    if (!S) {
      caption('Captain Aidana glides gently towards Paris…', 3);
      await wait(3.2);
      res({ stars: 3, rings: 6 }); return;
    }
    await landingIntro();
    const hud = $('#landHud'), hintEl = $('#landHint'), dot = $('#ils .dot'), stick = $('#stick'), canvas = $('#gl');
    hud.classList.add('show');
    const yI = z => (z < 0 ? -z * SLOPE : 0);
    const st = { z: START_Z, sx: 5, y: yI(START_Z) + 4, vsx: 0, vy: 0, speed: 24, stickX: 0, stickY: 0, rings: 0, fails: 0, assist: 0.3, state: 'fly', lastHint: '' };
    const keys = { l: 0, r: 0, u: 0, d: 0 };
    let warnUntil = 0;
    const hint = (text, warn = false) => {
      if (warn) warnUntil = E.time + 0.8; else if (E.time < warnUntil) return;
      if (text === st.lastHint) return;
      st.lastHint = text; hintEl.textContent = text; hintEl.classList.toggle('show', !!text); hintEl.classList.toggle('warn', warn);
    };
    // touch joystick (drag anywhere)
    let pid = null, ox = 0, oy = 0;
    const down = e => {
      if (st.state !== 'fly' || pid !== null) return;
      pid = e.pointerId; ox = e.clientX; oy = e.clientY;
      try { canvas.setPointerCapture(pid); } catch (er) {}
      stick.style.left = ox + 'px'; stick.style.top = oy + 'px'; stick.style.display = 'block';
    };
    const move = e => {
      if (e.pointerId !== pid) return;
      const dx = clamp(e.clientX - ox, -55, 55), dy = clamp(e.clientY - oy, -55, 55);
      st.stickX = dx / 55; st.stickY = -dy / 55;
      stick.firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
    };
    const up = e => { if (e.pointerId !== pid) return; pid = null; st.stickX = st.stickY = 0; stick.style.display = 'none'; stick.firstElementChild.style.transform = ''; };
    canvas.addEventListener('pointerdown', down); canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    const dpadBtns = [...document.querySelectorAll('#dpad button')];
    const dpDown = e => { e.preventDefault(); const b = e.currentTarget; keys[b.dataset.d] = 1; b.classList.add('on'); };
    const dpUp = e => { const b = e.currentTarget; keys[b.dataset.d] = 0; b.classList.remove('on'); };
    dpadBtns.forEach(b => { b.addEventListener('pointerdown', dpDown); b.addEventListener('pointerup', dpUp); b.addEventListener('pointerleave', dpUp); b.addEventListener('pointercancel', dpUp); });
    const KM_ = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
    const kd = e => { const k = KM_[e.key]; if (k) { keys[k] = 1; e.preventDefault(); } };
    const ku = e => { const k = KM_[e.key]; if (k) keys[k] = 0; };
    window.addEventListener('keydown', kd); window.addEventListener('keyup', ku);
    const cleanup = () => {
      canvas.removeEventListener('pointerdown', down); canvas.removeEventListener('pointermove', move);
      canvas.removeEventListener('pointerup', up); canvas.removeEventListener('pointercancel', up);
      dpadBtns.forEach(b => { b.removeEventListener('pointerdown', dpDown); b.removeEventListener('pointerup', dpUp); b.removeEventListener('pointerleave', dpUp); b.removeEventListener('pointercancel', dpUp); b.classList.remove('on'); });
      window.removeEventListener('keydown', kd); window.removeEventListener('keyup', ku);
      hud.classList.remove('show'); stick.style.display = 'none'; hintEl.classList.remove('show');
    };
    const reset = () => {
      st.z = START_Z; st.sx = st.fails ? 2.5 : 5; st.y = yI(START_Z) + (st.fails ? 2 : 4); st.vsx = st.vy = 0; st.rings = 0; st.state = 'fly';
      S.rings.forEach(r => { r.got = r.passed = false; r.m.visible = true; r.m.scale.setScalar(1); r.m.material.opacity = 0.95; r.halo.visible = true; });
      S.plane.userData.gear.visible = true;
    };
    const fail = async msg => {
      st.state = 'fail'; st.fails++; st.assist = st.fails === 1 ? 0.65 : 0.95;
      hint(''); Sound.warn();
      await toast('Go around! 🔄', msg, 2.2);
      await fade(true, '#ffffff', 0.5);
      reset();
      caption(st.fails >= 2 ? 'Autopilot is helping a lot more now ✨' : 'The autopilot will help a little more ✨', 3);
      await fade(false, '#ffffff', 0.5);
    };
    const touchdown = async () => {
      st.state = 'roll';
      Sound.thud(); CAM.shake = 0.18; S.puff(-st.sx - 0.85, st.z); S.puff(-st.sx + 0.85, st.z);
      hint(''); cleanup();
      const score = st.rings + (Math.abs(st.sx) < 2 ? 2 : Math.abs(st.sx) < 4 ? 1 : 0);
      const stars = score >= 7 ? 3 : score >= 4 ? 2 : 1;
      CAM.smooth = 2.2;
      CAM.follow = () => ({ pos: V3(S.plane.position.x - 13, 3.4, S.plane.position.z + 10), look: V3(S.plane.position.x, 1.2, S.plane.position.z) });
      confetti(80); Sound.fanfare();
      toast('Welcome to Paris! 🗼', `${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}  ·  Golden rings ${st.rings}/6`, 3.4);
      await wait(4.2);
      CAM.follow = null; CAM.smooth = 3.2;
      S.game = null; res({ stars, rings: st.rings });
    };
    reset();
    CAM.smooth = 8;
    Sound.engine && Sound.engine.set(0.6, 1.25);
    S.game = (dt, t) => {
      const P = S.plane;
      if (st.state === 'fly') {
        const k = clamp((st.z - START_Z) / -START_Z, 0, 1);
        st.speed = lerp(24, 17, k);
        st.z += st.speed * dt;
        const yi = yI(st.z);
        const inX = clamp(st.stickX + keys.r - keys.l, -1, 1), inY = clamp(st.stickY + keys.u - keys.d, -1, 1);
        const idleX = Math.abs(inX) < 0.05, idleY = Math.abs(inY) < 0.05;
        const gust = (Math.sin(t * 0.7) * 0.9 + Math.sin(t * 1.9 + 1) * 0.5) * (1 - st.assist * 0.7);
        const tVsx = inX * 7 + gust + (idleX ? -st.sx * st.assist * 0.8 : 0);
        st.vsx += (tVsx - st.vsx) * Math.min(1, dt * 3); st.sx = clamp(st.sx + st.vsx * dt, -30, 30);
        const glideVy = st.z < 0 ? -SLOPE * st.speed : -1.4;
        const tVy = glideVy + inY * 6 + Math.sin(t * 1.1) * 0.35 * (1 - st.assist) + (idleY ? (yi - st.y) * st.assist * 0.9 : 0);
        st.vy += (tVy - st.vy) * Math.min(1, dt * 3); st.y = Math.min(60, st.y + st.vy * dt);
        if (st.z < -3 && st.y < 1.2) { st.y = 1.2; st.vy = Math.max(0, st.vy); hint('Pull up! ↑', true); }
        for (const r of S.rings) if (!r.passed && st.z >= r.z) {
          r.passed = true;
          if (Math.hypot(st.sx - r.sx, st.y - r.y) < 3.3) {
            r.got = true; st.rings++; Sound.chime(); r.halo.visible = false;
            sparkleBurst(S, -r.sx, r.y + GEAR_H, r.z + 4, '#ffe08a', 18, 0.9, 3);
            tween(0.6, q => { r.m.scale.setScalar(1 + q * 0.8); r.m.material.opacity = 0.95 * (1 - q); }).then(() => { r.m.visible = false; });
          }
        }
        if (st.z >= -3 && st.y <= 0.3) {
          if (Math.abs(st.sx) <= 6.6) touchdown(); else fail('Oops — we missed the runway! Let’s try again ✈️');
        } else if (st.z > 75) fail('A little too high — let’s circle around and try again!');
        if (st.state === 'fly') {
          const dx = st.sx, dy = st.y - yi;
          if (st.z > -40) P.userData.gear.visible = true;
          if (dy > 3) hint('↓ A little lower');
          else if (dy < -2.5 && st.z < -10) hint('↑ A little higher');
          else if (dx > 3) hint('← A little to the left');
          else if (dx < -3) hint('→ A little to the right');
          else if (st.z > -60) hint('Perfect — gently now… 💛');
          else hint('');
          dot.style.transform = `translate(${(clamp(dx / 8, -1, 1) * 34).toFixed(1)}px,${(clamp(-dy / 6, -1, 1) * 34).toFixed(1)}px)`;
          dot.style.background = Math.hypot(dx / 8, dy / 6) < 0.45 ? '#7dffb0' : '#ff6f9c';
          $('#lhDist').textContent = st.z < 0 ? `${Math.round(-st.z * 9).toLocaleString('en-US')} m` : 'now!';
          $('#lhRings').textContent = `${st.rings}/6`;
        }
      } else if (st.state === 'roll') {
        st.speed = Math.max(0, st.speed - 7 * dt); st.z += st.speed * dt; st.y = 0; st.vy = 0; st.sx += (0 - st.sx) * Math.min(1, dt * 0.8); st.vsx = 0;
        Sound.engine && Sound.engine.set(0.3 + st.speed / 40, 0.8 + st.speed / 40);
      }
      P.position.set(-st.sx, st.y + GEAR_H, st.z);
      P.rotation.z = clamp(st.vsx * 0.07, -0.5, 0.5);
      P.rotation.x = st.state === 'roll' ? 0 : clamp(-st.vy * 0.04, -0.25, 0.25);
      if (st.state === 'fly') {
        CAM.pos.set(-st.sx * 0.6, st.y + GEAR_H + 3.2, st.z - 10.5);
        CAM.look.set(-st.sx * 0.3, (st.y + GEAR_H) * 0.6, st.z + 18);
      }
    };
  });
}

function drawCover(g, img, W, H) {
  const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
  g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
}
function drawPlaceholderPortrait(g, W, H) {
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#9cc0ea'); sky.addColorStop(0.6, '#ffd2b0'); sky.addColorStop(1, '#e8a98f');

  g.strokeStyle = '#6d5038'; g.lineWidth = 6; g.beginPath(); g.moveTo(W * 0.3, H * 0.75); g.lineTo(W * 0.5, H * 0.1); g.lineTo(W * 0.7, H * 0.75); g.stroke();
  g.font = `${W * 0.3}px serif`; g.textAlign = 'center'; g.fillText('💑', W / 2, H * 0.8);
  g.font = `400 ${W * 0.12}px "Great Vibes", cursive`; g.fillStyle = '#7a2a44'; g.fillText(CONFIG.initials, W / 2, H * 0.95);
}
async function paintReveal(cv, img, onProg) {
  const W = cv.width, H = cv.height, g = cv.getContext('2d');
  g.fillStyle = '#f6f0e3'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 2500; i++) { g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.3)'; g.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5); }
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  const sg = src.getContext('2d');
  if (img) drawCover(sg, img, W, H); else drawPlaceholderPortrait(sg, W, H);
  let data = null;
  try { data = sg.getImageData(0, 0, W, H).data; } catch (e) { data = null; }
  const anim = (ms, step) => new Promise(r => {
    const t0 = performance.now();
    const f = now => { const k = Math.min(1, (now - t0) / ms); step(k); if (k < 1) requestAnimationFrame(f); else r(); };
    requestAnimationFrame(f);
  });
  if (data) {
    const w2 = W >> 1, h2 = H >> 1, gray = new Float32Array(w2 * h2), gx = new Float32Array(w2 * h2), gy = new Float32Array(w2 * h2);
    for (let y = 0; y < h2; y++) for (let x = 0; x < w2; x++) { const i = ((y * 2) * W + x * 2) * 4; gray[y * w2 + x] = data[i] * 0.3 + data[i + 1] * 0.59 + data[i + 2] * 0.11; }
    const cand = [];
    for (let y = 1; y < h2 - 1; y++) for (let x = 1; x < w2 - 1; x++) {
      const i = y * w2 + x, a = gray[i - w2 - 1], b = gray[i - w2], c = gray[i - w2 + 1], d = gray[i - 1], f = gray[i + 1], gg = gray[i + w2 - 1], h = gray[i + w2], ii = gray[i + w2 + 1];
      const sx = -a - 2 * d - gg + c + 2 * f + ii, sy = -a - 2 * b - c + gg + 2 * h + ii;
      gx[i] = sx; gy[i] = sy;
      if (Math.hypot(sx, sy) > 110 && Math.random() < 0.6) cand.push(i);
    }
    for (let i = cand.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [cand[i], cand[j]] = [cand[j], cand[i]]; }
    onProg(0, 'The artist sketches your silhouettes…');
    let ei = 0;
    await anim(2600, k => {
      const target = Math.floor(k * cand.length);
      g.strokeStyle = 'rgba(55,45,40,.33)'; g.lineWidth = 1.1; g.beginPath();
      while (ei < target) {
        const id = cand[ei++], x = (id % w2) * 2, y = ((id / w2) | 0) * 2, an = Math.atan2(gy[id], gx[id]) + Math.PI / 2, l = rand(3, 9);
        g.moveTo(x - Math.cos(an) * l, y - Math.sin(an) * l); g.lineTo(x + Math.cos(an) * l, y + Math.sin(an) * l);
      }
      g.stroke(); onProg(k * 0.3);
      if (Math.random() < 0.06) Sound.brush();
    });
    onProg(0.3, 'Now adding colour, stroke by stroke…');
    await anim(4800, k => {
      const r = lerp(24, 3, Math.pow(k, 0.7)), n = Math.floor(lerp(70, 260, k));
      for (let i = 0; i < n; i++) {
        const x = Math.random() * W, y = Math.random() * H, idx = ((y | 0) * W + (x | 0)) * 4, id2 = (y >> 1) * w2 + (x >> 1);
        const an = Math.atan2(gy[id2] || 0, gx[id2] || 1) + Math.PI / 2;
        g.fillStyle = `rgba(${data[idx]},${data[idx + 1]},${data[idx + 2]},0.85)`;
        g.beginPath(); g.ellipse(x, y, r * 1.8, r * 0.6, an, 0, Math.PI * 2); g.fill();
      }
      onProg(0.3 + k * 0.55);
      if (Math.random() < 0.08) Sound.brush();
    });
    onProg(0.85, 'Finishing touches…');
    await anim(1600, k => { g.globalAlpha = 0.06 + k * 0.2; g.drawImage(src, 0, 0); g.globalAlpha = 1; onProg(0.85 + k * 0.15); });
    g.drawImage(src, 0, 0);
  } else {
    onProg(0, 'The artist is painting…');
    await anim(6500, k => {
      for (let i = 0; i < 30; i++) {
        const x = Math.random() * W, y = Math.random() * H, r = lerp(40, 10, k);
        g.save(); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip(); g.drawImage(src, 0, 0); g.restore();
      }
      onProg(k);
      if (Math.random() < 0.08) Sound.brush();
    });
    g.drawImage(src, 0, 0);
  }

  g.fillText(`Paris, ${new Date().getFullYear()} ♥`, W - 22, H - 22);
  onProg(1, 'Ta-da — your portrait is ready!');
}

  gr.addColorStop(0, '#e2506a'); gr.addColorStop(0.6, '#a81c36'); gr.addColorStop(1, '#6e0f20');
  g.fillStyle = gr; g.shadowColor = 'rgba(80,0,20,.35)'; g.shadowBlur = 16; g.shadowOffsetY = 6; g.fill();
  g.shadowColor = 'transparent';
  g.strokeStyle = 'rgba(255,205,190,.5)'; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, r * 0.72, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(255,215,200,.75)'; g.font = '14px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; g.fillText('♥', Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86); }

}

async function saveCertificate(canvas) {
  const fname = `${CONFIG.herName}-and-${CONFIG.hisName}-Marriage-Certificate.png`.replace(/\s+/g, '-');
  const url = canvas.toDataURL('image/png');
  let file = null;
  try {
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    if (blob && typeof File === 'function') file = new File([blob], fname, { type: 'image/png' });
  } catch (e) { file = null; }
  let canShare = false;
  try { canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  const ov = overlay(`<div class="card">
      <div class="big" style="font-size:42px">Save our certificate</div>
      <img alt="Our marriage certificate">
      <p class="hint">📱 Press and hold the image, then choose “Save to Photos”.</p>
      <div class="row">
        ${canShare ? '<button class="btn yes share">Share / Save 📲</button>' : ''}
        <a class="btn gold dl">Download PNG ⬇</a>
        <button class="btn no close">Close</button>
      </div></div>`, 'saveModal');
  ov.querySelector('img').src = url;
  const dl = ov.querySelector('.dl'); dl.href = url; dl.setAttribute('download', fname);
  dl.addEventListener('click', () => Sound.pop());
  const sh = ov.querySelector('.share');
  if (sh) sh.addEventListener('click', () => {
    navigator.share({ files: [file], title: 'Our Marriage Certificate 💍', text: `${CONFIG.herName} & ${CONFIG.hisName} — from ${CONFIG.herCity} to ${CONFIG.hisCity}` }).catch(() => {});
  });
  ov.querySelector('.close').addEventListener('click', () => ov.close());
}
async function certificateOverlay() {
  const c = await drawCertificate();
  const ov = overlay(`<div class="certWrap">
      <div class="title">Forever, officially 💍</div>
      <img class="certImg" alt="Official marriage certificate">
      <div class="row">
        <button class="btn yes save">Save as Photo 📸</button>
        <button class="btn ghost again">Play again ↺</button>

  return new Promise(() => {});
}

    ['narr', 'Night falls over Paris. Hand in hand, you walk towards the sparkling lights…'],
    ['aidana', 'It’s… glittering! Is it always like this?'],
    ['leo', 'Only for five minutes every hour. I timed it perfectly. 😉'],
  ]);
  await walking;
  await act(S, async () => {
    CAM.follow = null; CAM.smooth = 3.2;
    holdHands(S.leo, S.aidana, false);
    faceAngle(S.leo, Math.PI / 2); faceAngle(S.aidana, -Math.PI / 2);
    await camTo(V3(0.25, 0.95, -1.0), V3(0, 1.75, -4), 2.2);
  });
  await talk([
    ['leo', `${CONFIG.herName}… can I tell you something?`],
    ['leo', `Every one of those ${KM} kilometres taught me the same thing: I never want to be far from you again.`],
  ]);
  await act(S, async () => {
    S.leo.setPose('kneel'); Sound.heart();
    await wait(1.0);
    await tween(0.5, k => S.box.group.scale.setScalar(Math.max(0.001, k)), Ease.outBack);
    await wait(0.3);
    await tween(0.7, k => { S.box.lid.rotation.x = -1.9 * k; }, Ease.outBack);
    S.ringGlow = true; Sound.chime(); Sound.sparkle();
    S.aidana.setPose('gasp');
  });
  if (!S) Sound.chime();
  await talk([['aidana', `${CONFIG.hisName}… oh my goodness… 🥹`]]);
  await proposalOverlay();
  Sound.fanfare(); confetti(120); hearts(innerWidth / 2, innerHeight * 0.55, 30);
  toast('She said YES!', '💍 Forever starts now', 3.4);
  await act(S, async () => {
    S.box.group.scale.setScalar(0.001); S.ringGlow = false;
    S.leo.setPose('stand');
    S.aidana.setPose('stand'); hop(S.aidana, 3);
    S.fw.heart(0, 70, -110, 11);
    S.fireworks = true;
    let next = E.time + 0.6;
    const prev = S.update;
    S.update = (dt, t) => { prev(dt, t); if (S.fireworks && t > next) { next = t + rand(0.7, 1.4); S.fw.burst(rand(-55, 55), rand(45, 88), -110 + rand(-25, 15)); } };
    await wait(1.2);
    await Promise.all([walkTo(S.leo, -0.24, -4, 0.6), walkTo(S.aidana, 0.24, -4, 0.6)]);
    faceAngle(S.leo, Math.PI / 2); faceAngle(S.aidana, -Math.PI / 2);
    S.leo.setPose('hug'); S.aidana.setPose('hug', { headZ: 0.15 });
    camTo(V3(0.4, 1.6, 3.2), V3(0, 4.2, -20), 4);
  });
  if (!S) { Sound.boom(); }
  await wait(1.5);
  await talk([
    ['aidana', 'YES! A thousand times yes! 💖'],
    ['leo', `You just made me the happiest man in ${CONFIG.hisCity}… and in ${CONFIG.herCity} too.`],
  ]);
}
async function chapter7() {
  await chapterBanner(6);
  await certificateOverlay();
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
async function boot() {
  buildProgress();
  const app = $('#app');
  app.addEventListener('scroll', () => { app.scrollTop = 0; app.scrollLeft = 0; });
  window.addEventListener('scroll', () => window.scrollTo(0, 0));
  try { Sound.muted = localStorage.getItem('al_muted') === '1'; } catch (e) {}
  $('#audioBtn').textContent = Sound.muted ? '🔇' : '🔊';
  $('#audioBtn').addEventListener('click', () => { Sound.init(); Sound.setMuted(!Sound.muted); $('#audioBtn').textContent = Sound.muted ? '🔇' : '🔊'; });
  requestAnimationFrame(t => { E.last = t; requestAnimationFrame(frame); });
  const msg = $('#loadMsg');
  await loadPhotos();
  const ok = await initGL().catch(() => false);
  await ensureFonts();
  msg.textContent = ok ? '' : 'Simplified 2D version on this device';
  const btn = $('#startBtn'); btn.disabled = false; btn.textContent = 'Begin';
  await new Promise(r => btn.addEventListener('click', r, { once: true }));
  Sound.init(); Sound.resume(); Sound.startMusic(); Sound.pop();
  $('#hud').classList.add('show');
  try {
    await chapter1(); await chapter2(); await chapter3(); await chapter4();
    await chapter5(); await chapter6(); await chapter7();
  } catch (e) {
    console.warn('Story error', e);
    const ov = overlay(`<div class="card"><div class="big" style="font-size:44px">Oops!</div><p>Something hiccuped — but love always finds a way.</p><button class="btn yes">Start again ↺</button></div>`);
    ov.querySelector('button').addEventListener('click', () => location.reload());
  }
}
boot();
